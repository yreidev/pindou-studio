          - consume_reverse
        accountId: *loyalty003
        targetId: *loyalty003
        expectedVersion:
          $ref: '#/components/schemas/OrderVersion'
        quoteVersion:
          $ref: '#/components/schemas/OrderVersion'
        rule:
          $ref: '#/components/schemas/LoyaltyRule'
        birthday:
          type: string
          pattern: ^[0-9]{2}-[0-9]{2}$
        reason:
          type: string
          maxLength: 200
        method:
          type: string
