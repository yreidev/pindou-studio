    Coupon:
      type: object
      additionalProperties: false
      required: [platform]
      description: >-
        团购记录（2026-10-10 起）：顾客在哪个平台买的团购和券码，预约和扫码入座都能填、都选填。门店接不了美团的验券接口，
        店员在美团开店宝扫顾客手机上的券码核销，系统只记下来给店员看。券码不进日志。
      properties:
        platform:
          type: string
          enum: [meituan, dianping, in_store, '']
