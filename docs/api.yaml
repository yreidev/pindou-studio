openapi: 3.1.0
info:
  title: Pindou Studio API
  version: 0.4.0
  description: >-
    单门店后端与微信小程序、员工网页后台的 REST 契约。仅接受 Bearer 业务会话；桌码进入小程序入座。金额均为分，折扣比例均为整数基点。
    任何接口都可能回：500 internal_error（服务出错，这次操作没有生效）、500 persistence_rejected（数据库按约束拒收，重试没用）、
    503 persistence_failed（数据库暂时不可用或冲突太多，可以再试）。
servers:
  - url: /api/v2
security:
  - MiniappBearer: []
paths:
  /healthz:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: 服务健康，并给出正在运行的构建，用于发布后核对版本
          content:
            application/json:
              schema:
                type: object
                required: [status, version, commit]
                properties:
                  status: { type: string, enum: [ok] }
                  version:
                    type: string
                    description: 后端发布版本号（backend-v0.0.39 去掉 backend-v，如 0.0.39）；本地构建为 dev。网页后台版本由页面构建时单独写入
                  commit:
                    type: string
                    description: 构建所用的 git commit；本地从未提交的工作区构建时带 -dirty 后缀，无法确定时为 unknown
  /readyz:
    get:
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: 服务及持久化依赖已就绪
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready] }
        '503': { description: 正在停止（draining，收到停止信号后立刻失败，不再接新请求）或读不了数据库（not_ready） }
  /statusz:
    get:
      operationId: getStatus
      security: []
      description: 给外部监控看（deploy/monitor.sh）。不含业务数据。也可不带 /api/v2 前缀访问。
      responses:
        '200':
          description: 在跑的构建、最近一次本机与异地备份（从没成功过的为 null）和 WAL 归档状态
          content:
            application/json:
              schema:
                type: object
                required: [status, version, commit, backups, walArchive]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, description: 同 /healthz 的 version }
                  commit: { type: string }
                  backups:
                    type: object
                    required: [local, offsite]
                    properties:
                      local: { $ref: '#/components/schemas/BackupRun' }
                      offsite: { $ref: '#/components/schemas/BackupRun' }
                  walArchive:
                    description: >-
                      WAL 连续归档（按时间点恢复靠它）。数据库没开归档时为 null。基础备份的新鲜度不在这里，
                      数据库层面查不到，见 docs/deployment.md。
                    type: [object, 'null']
                    required: [lastArchivedAt, lastFailedAt, failing]
                    properties:
                      lastArchivedAt: { type: [string, 'null'], format: date-time, description: 最近一次归档成功；从没成功过为 null。库里没有写入时不会有新的归档，旧不等于坏 }
                      lastFailedAt: { type: [string, 'null'], format: date-time, description: 最近一次归档失败；从没失败过为 null }
                      failing: { type: boolean, description: 最近一次失败晚于最近一次成功，即归档正卡着 }
        '503': { description: 读不了数据库（not_ready） }
  /system/miniapp-version:
    get:
      operationId: getMiniappVersion
      description: 所有员工可读。返回员工手机最近上报的正式版运行版本与服务端收到的时间；手机可能尚未更新，这不是微信当前最新发布版本。没有上报记录时 release 为 null。
      responses:
        '200':
          description: 最近使用的小程序正式版
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniappVersionStatus' }
        '401': { description: 未登录（unauthorized） }
        '403': { description: 没有员工权限（forbidden） }
    post:
      operationId: reportMiniappVersion
      description: 仅员工的小程序会话可上报。小程序从 wx.getAccountInfoSync 读取 envVersion 与 version，只在正式版上报；不使用构建版本号兜底。记录版本与服务端收到时间，不记录设备或微信标识；非正式版请求被拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MiniappVersionReport' }
      responses:
        '200':
          description: 已记录本次正式版运行版本，员工网页实时刷新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiniappVersionStatus' }
        '400': { description: 不是正式版或版本号无效（invalid_request） }
        '401': { description: 未登录（unauthorized） }
        '403': { description: 没有员工权限或不是小程序会话（forbidden） }
  /auth/wechat-sessions:
    post:
      operationId: createWechatSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WechatSessionInput' }
      responses:
        '201':
          description: 已为已注册用户创建小程序会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WechatSession' }
        '404': { description: 微信身份尚未注册（not_registered） }
        '429': { description: 未登录身份接口触发限流（rate_limited），响应头 Retry-After 给出重试秒数，不创建会话也不消费微信凭证 }
        '502': { description: 向微信换取登录身份失败（wechat_unavailable），可重试 }
        '503': { description: 会话未能保存（persistence_failed），不发放令牌，可重试 }
  /auth/member-claims:
    post:
      operationId: createMemberClaim
      security: []
      description: >-
        小程序认领已有账户（2026-10-27 起）：店员代开的会员，或以前在顾客网页（2026-10-31 下线）注册的账户，用手机号加员工发的
        临时密码（createPasswordReset；以前在网页设过密码的，填那个也行）把这个微信绑到那个账户上，同意隐私协议，发一张小程序会话
        （同 createAccount）。账户本人还没同意过隐私协议的（店员代开的），这次记下同意。用临时密码认领后临时密码作废；以前设的密码不作废。
        先核对手机号和密码（号没有认领密码、密码不对一律 401，不区分），再看账户和微信：
        账户已经绑了别的微信 409 already_claimed，这个微信已经注册过别的账户 409 already_registered。按来源限流，另按手机号每 15 分钟 5 次（不论成败）。记审计。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberClaimInput' }
      responses:
        '201':
          description: 已认领并创建小程序会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WechatSession' }
        '400': { description: 参数无效（invalid_request） }
        '401': { description: 手机号或密码不对（invalid_credentials）；临时密码已过期（temporary_password_expired） }
        '409': { description: 账户已经绑了微信（already_claimed），或这个微信已注册过别的账户（already_registered），都不改任何东西 }
        '429': { description: 太频繁（rate_limited），带 Retry-After }
        '502': { description: 向微信换取登录身份失败（wechat_unavailable），可重试 }
  /member-accounts:
    post:
      operationId: createMemberAccount
      description: >-
        员工代开会员（2026-10-27 起，所有员工）：顾客在柜台报称呼和手机号、口头同意后，员工替他开一个账户，马上能充值、登记消费。
        代开的账户没有微信：员工用 createPasswordReset 发临时密码，顾客在小程序登录页用 createMemberClaim 认领，
        认领时补同意隐私协议。手机号已被任何账户用过（资料里的号或认领用的号，去掉空格和横线比）时不新建，返回那个账户（existing 为 true）。
        记审计（只写称呼和账户编号，不写手机号）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemberAccountInput' }
      responses:
        '201':
          description: 已代开
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberAccountOpened' }
        '200':
          description: 这个号已经有账户，没有新建，返回那个账户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberAccountOpened' }
        '400': { description: 称呼或手机号格式不对、没勾顾客同意（invalid_request） }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 不是员工 }
  /auth/web-login-challenges:
    post:
      operationId: createWebLoginChallenge
      security: []
      description: 电脑网页后台发起扫码登录。挑战 3 分钟过期，只在服务端内存里；网页把 qrText 画成二维码，员工用小程序扫码（wx.scanCode）后批准。pollToken 只返回这一次，网页凭它领取会话。按来源限流。
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                required: [id, pollToken, qrText, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  pollToken: { type: string, description: 只交给发起的网页，不能放进二维码 }
                  qrText: { type: string, description: '"pindou-web-login:" + id' }
                  expiresAt: { type: string, format: date-time }
        '429': { description: 未登录身份接口触发限流（rate_limited） }
        '503': { description: 同时待批准的挑战太多（too_many_challenges） }
  /auth/web-login-challenges/{challengeId}:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getWebLoginChallenge
      description: 员工扫码后查看是哪台设备发起的，确认是自己的电脑再批准。仅员工角色可读。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebLoginChallenge' }
        '401': { description: 未登录 }
        '403': { description: 无员工角色 }
        '404': { description: 挑战不存在（已过期很久或服务重启） }
  /auth/web-login-challenges/{challengeId}/decision:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideWebLoginChallenge
      description: 员工批准或拒绝。批准后网页领到的会话属于批准者本人（开发者的当前体验身份一并带过去）。批准与拒绝都写审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [approve]
              properties:
                approve: { type: boolean }
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [approved, rejected] }
        '400': { description: 缺少 approve }
        '401': { description: 未登录 }
        '403': { description: 无员工角色 }
        '404': { description: 挑战不存在 }
        '409': { description: 挑战已处理或已过期（challenge_not_pending） }
  /auth/web-login-challenges/{challengeId}/session:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: claimWebSession
      security: []
      description: 网页轮询。批准后第一次调用领到网页会话（12 小时，client=web），之后同一挑战不能再领。不限流（需要 pollToken）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pollToken]
              properties:
                pollToken: { type: string }
      responses:
        '201':
          description: 已发放网页会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WechatSession' }
        '202':
          description: 还在等员工批准
          content:
            application/json:
              schema:
                type: object
                required: [status, expiresAt]
                properties:
                  status: { type: string, enum: [pending] }
                  expiresAt: { type: string, format: date-time }
        '404': { description: 挑战不存在或 pollToken 不对（两者不区分） }
        '410': { description: 已拒绝、已过期或已领取（challenge_closed），网页应刷新二维码 }
        '503': { description: 会话未能保存（persistence_failed），可继续轮询 }
  /auth/web-login-challenges/{challengeId}/code:
    parameters:
      - { name: challengeId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: getWebLoginCode
      security: []
      description: >-
        发起登录的网页拿 pollToken 换一张小程序码：员工用微信扫一扫直接打开小程序的批准页（pages/staff/web-login/index），
        scene 是去掉连字符的挑战编号。指向的小程序版本与桌码相同（老板在 /system/code-settings 设置）。按来源限流（每次都调一次微信）。
        生成不了时（503）网页退回把挑战的 qrText 画成普通二维码，员工在小程序里用「扫码」扫。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pollToken]
              properties:
                pollToken: { type: string }
      responses:
        '200':
          description: 小程序码图片
          content:
            application/json:
              schema:
                type: object
                required: [imageDataUrl]
                properties:
                  imageDataUrl: { type: string, description: 'data:image/png;base64,…' }
        '400': { description: 缺 pollToken }
        '404': { description: 挑战不存在或 pollToken 不对（两者不区分） }
        '410': { description: 挑战已不是待批准（challenge_closed），网页应换一个挑战 }
        '429': { description: 太频繁（rate_limited），带 Retry-After }
        '503': { description: 没配微信或微信出错（wechat_unavailable，message 带微信的 errcode），网页退回普通二维码 }
  /auth/sessions/current:
    delete:
      operationId: deleteCurrentSession
      description: 退出当前登录，当前令牌立即失效。其他设备的会话不受影响。
      responses:
        '204': { description: 已退出 }
        '401': { description: 未登录 }
  /auth/web-sessions:
    delete:
      operationId: deleteMyWebSessions
      description: 注销本人在电脑网页后台的全部登录（小程序会话不受影响），写审计。
      responses:
        '200':
          description: 已注销
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, minimum: 0 }
        '401': { description: 未登录 }
  /auth/developer-sessions:
    post:
      operationId: switchDeveloperSession
      description: 仅服务端配置的开发者账号可调用。切换当前会话的有效身份，不修改员工任命；旧 Bearer 立即失效，其他设备会话不变。操作真实保存，切换记录写入审计。响应丢失时需重新登录，不能用已失效旧凭证重试。会话到期时间不延长。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/DeveloperMode' }
      responses:
        '201':
          description: 已更换会话凭证，user.roles 为当前有效员工角色
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WechatSession' }
        '400': { description: 身份无效 }
        '401': { description: 会话失效 }
        '403': { description: 当前账号未配置开发者授权 }
        '503': { description: 保存失败，原会话及身份不变 }
  /accounts:
    get:
      operationId: listAccounts
      description: >-
        员工找顾客：按关键字在库里筛选、分页，新注册的在前，不带头像。总数与实际页码在响应头里。
      parameters:
        - name: q
          in: query
          description: 关键字（去掉首尾空白，不分大小写）：昵称或打码后的手机号包含它、账户编号以它开头，或完整手机号等于它
          schema: { type: string, maxLength: 100 }
        - { name: page, in: query, description: 从 1 起, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, description: 不带时每页 20 条, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 账户列表，仅员工可读取
          headers:
            X-Total-Count: { description: 匹配的总条数, schema: { type: integer } }
            X-Page: { description: 实际返回的页码（超出时落到最后一页）, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        '400': { description: 页码或每页条数不合法 }
        '403': { description: 顾客无权列出账户 }
    post:
      operationId: createAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountRegistrationInput' }
      responses:
        '201':
          description: 用户已注册并创建小程序会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WechatSession' }
        '409':
          description: >-
            微信身份已注册（already_registered），直接登录；或填的手机号（去掉空格和横线比）属于一个还没绑微信的账户（店员代开或网页注册的，claim_required），
            不另建新号，提示顾客点注册页的「去认领会员」（登录页是「店员帮我开过会员，去认领」）认领。都不创建账户或会话
        '400': { description: 注册参数无效或头像不合法（invalid_avatar），不创建账户或会话 }
        '502': { description: 向微信换取登录身份或手机号失败（wechat_unavailable），不创建账户或会话 }
        '429': { description: 未登录身份接口触发限流（rate_limited），响应头 Retry-After 给出重试秒数，不创建账户也不消费微信凭证 }
  /accounts/{accountId}:
    get:
      operationId: getAccount
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: 用户资料；本人或授权员工可读取
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
    patch:
      operationId: updateAccount
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountUpdateInput' }
      responses:
        '200':
          description: 用户资料已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: 参数无效（invalid_request）或头像不合法（invalid_avatar）；有认领密码的账户换手机号时，新号去掉空格和横线后须为 6～15 位数字 }
        '409': { description: 有认领密码的账户换成的手机号已被别的账户用过（phone_registered），资料不变；认领用的号随资料一起换 }
        '502': { description: 用 phoneCode 向微信换取手机号失败（wechat_unavailable），资料不变 }
  /accounts/{accountId}/sales-orders:
    get:
      operationId: listAccountOrders
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: 用户订单；顾客只能读取本人记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
  /accounts/{accountId}/password-resets:
    post:
      operationId: createPasswordReset
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      description: >-
        员工给顾客发一次性临时密码：顾客在小程序登录页用手机号加它认领员工代开的会员（createMemberClaim）。8 位数字，24 小时内有效，
        认领后作废；换掉这个账户原来的认领密码。账户还没有认领密码时，按它资料里的手机号开一条。
        店员只能给顾客发，给员工发要能管理对方的角色（同任命规则）。记审计，临时密码只在这次响应里出现。
      responses:
        '201':
          description: 已发临时密码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordReset' }
        '401': { description: 未登录 }
        '403': { description: 不是员工，或无权管理这位员工（forbidden） }
        '404': { description: 账户不存在 }
        '409': { description: 账户资料里没有可用的手机号（phone_missing），或这个号已被别的账户用来认领（phone_registered） }
  /staff-role-assignments:
    get:
      operationId: listStaffRoleAssignments
      responses:
        '200':
          description: 员工角色授权记录，带被任命账户的称呼
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffRoleAssignmentList' }
        '403': { description: 无权查看角色授权 }
    post:
      operationId: createStaffRoleAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffRoleAssignmentInput' }
      responses:
        '201':
          description: 员工角色已授予（替换此人原有的任命）。不收幂等键：重复提交只是把同一角色再任命一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffRoleAssignmentCreated' }
        '400': { description: invalid_role 角色无效；invalid_request 格式不对 }
        '403': { description: 无权管理目标角色 }
        '404': { description: 账户不存在 }
        '409': { description: last_owner 不能把最后一位老板换成别的角色 }
  /staff-role-assignments/{assignmentId}:
    delete:
      operationId: deleteStaffRoleAssignment
      parameters: [{ $ref: '#/components/parameters/AssignmentId' }]
      responses:
        '204': { description: 员工角色已撤销 }
        '409': { description: 不能撤销最后一名有效老板 }
  /floor-areas:
    get:
      operationId: listFloorAreas
      description: 区域由门店布局（layout/store-layout.json）决定，启动时校正；不能新建、改名或改网格，其他方法回 405 method_not_allowed。
      responses:
        '200':
          description: 区域列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FloorAreaList' }
  /service-tables:
    get:
      operationId: listServiceTables
      description: 桌位由门店布局决定，不能新建（POST 回 405 method_not_allowed）；员工只能启用、停用。
      responses:
        '200':
          description: 桌位列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceTableList' }
  /service-tables/{serviceTableId}:
    patch:
      operationId: updateServiceTable
      description: 店长、老板启用或停用桌位。桌号、座位数、整桌单位、位置都由布局决定，带 enabled 以外的字段回 400 layout_fixed。
      parameters: [{ $ref: '#/components/parameters/ServiceTableId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceTableUpdateInput' }
      responses:
        '400': { description: layout_fixed 带了 enabled 以外的字段；invalid_request 格式不对 }
        '403': { description: 店员、顾客无权修改 }
        '404': { description: 桌位不存在 }
        '409':
          description: >-
            table_occupied 桌位正在使用；table_reserved 桌位还有未到店的预约。
            停用前须先结束会话或取消、改期那些预约，否则顾客到店时开不了台。
        '200':
          description: 桌位已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceTable' }
  /venue-sessions:
    get:
      operationId: listServiceTableSessions
      parameters:
        - name: status
          in: query
          required: true
          description: 只能是 live：只回进行中的（active、paused、companion）。全部历史会越积越大，不提供
          schema: { type: string, enum: [live] }
      responses:
        '400': { description: 没带 status 或取值不认识 }
        '200':
          description: 桌位会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceTableSessionList' }
    post:
      operationId: createServiceTableSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceTableSessionInput' }
      responses:
        '201':
          description: 桌位会话已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceTableSession' }
        '409': { description: table_occupied 桌位正在使用；seat_reserved 这段时间内桌上有别人的预约；past_closing 开到打烊（untilClose）时已到或过了今天的打烊时间 }
  /venue-sessions/me:
    get:
      operationId: getMyVenueSessions
      description: >-
        登录者本人名下、进行中的整桌计时（员工从桌位开台时绑定了这位顾客的账户），先开的在前；「本次手作」页据此显示计时和「呼叫店员」。
        只列计时中、暂停中、陪客的（停止计时等结账的也算）；已结账、已撤销的不再列。扫码入座、到店开台的按座会话在 /loyalty/me 的
        admissions 里，这里不重复。计时数字与桌位接口同一套算法、按读取时刻算好；不带金额估算，也不带员工或别的顾客的信息。
        会话有变动时实时推送 venue-sessions（顾客只收本人名下的）。
      responses:
        '200':
          description: 本人的整桌计时；没有时为空数组
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyVenueSessionList' }
        '401': { description: 未登录 }
  /venue-sessions/{venueSessionId}:
    get:
      operationId: getServiceTableSession
      parameters: [{ $ref: '#/components/parameters/VenueSessionId' }]
      responses:
        '200':
          description: 单个桌位会话（员工）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceTableSession' }
        '404': { description: 会话不存在 }
    patch:
      operationId: updateServiceTableSession
      description: >-
        整桌开台的会话：暂停、继续、标记陪客、换桌、改开始时间、计时方式或时长，续时，以及停止计时。续时用 extendMinutes
        在 expectedDurationMinutes（员工确认时看到的时长）上追加，须带 Idempotency-Key：看到的时长已变返回 409
        session_conflict，同一操作者同一键同内容重放上次结果、不再追加，同键不同内容 409 idempotency_conflict。
        旧写法 durationMinutes（读到的时长加 N 的绝对值）仍接受。带了 Idempotency-Key 的其他修改同样按键重放。
        时长、计时方式变化或标记陪客时，这一台的草稿订单开头仍是系统按原计时生成的明细（员工没改过）就按新计时换掉这几行、
        重算应收（订单版本随之变化，审计 order.lines.repriced），员工加的其余明细照留；被改过则不动，响应的 draftOrder
        说明要员工去结账页核对。陪客会话不能暂停或继续。
        停止计时（stop: true，同按座会话的停止计时）须带 Idempotency-Key、单独提交：停在服务器收到请求的这一刻（暂停中的先结束暂停，
        暂停的时间照旧不计），返回的会话带 stoppedAt；计价按停止时刻冻结，草稿开头系统生成的计时明细当场按停止时刻重算存下；
        座位保留到结账（付款、免单或撤销开台）。停止后不能再暂停、继续、续时、改开始时间、计时方式或时长，也不能标陪客
        （409 invalid_session_state），换桌、撤销开台、去结账照旧。陪客不计时，不能停止（409）。审计 venue_session.stopped。
        计价按开台时记下的价（开台那一刻生效的套餐、续时方案、超时处理与宽限、自由计时价、陪客费），之后改价发布不影响已开的台；
        这份价只在后端，不在响应里。更早版本开的台没有记下价，按当时生效的规则算。
        结束（end: true，系统内收费关着时，2026-10-10 起）须带 Idempotency-Key、单独提交：结束计时并放座，会话状态改为 ended，
        这一台的草稿订单一并作废（审计 order.voided），审计 venue_session.ended（开始时间、计时方式、用了多久）；所有员工都能办。
      parameters:
        - { $ref: '#/components/parameters/VenueSessionId' }
        - { name: Idempotency-Key, in: header, required: false, description: 续时（extendMinutes）、停止计时（stop）与结束（end）必填，缺少时回 400 idempotency_required；其他修改可选, schema: { type: string, minLength: 1, maxLength: 255 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceTableSessionUpdateInput' }
      responses:
        '200':
          description: 桌位会话已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceTableSessionUpdateResult' }
        '400': { description: invalid_session 计时方式、时长或续时分钟无效（自由计时不能续时，续时须带 expectedDurationMinutes 且不能同时给 durationMinutes），或停止计时、结束和别的修改一起提交；idempotency_required 续时、停止计时、结束没带幂等键；invalid_request 格式不对 }
        '409': { description: 换桌时目标桌 table_occupied 正在使用；seat_reserved 换桌、续时、改时长或开始时间后新增的那段时间压到别人的预约（说明里写明是哪个预约）；session_conflict expectedDurationMinutes 与当前时长不符（别人刚改过或页面过期），核对后再确认；invalid_session_state 会话已结束，陪客会话要暂停、继续或停止计时，或已停止计时的会话要再停止、暂停、继续、续时或改计时；billing_enabled 系统内收费开着时要结束（请结账）；partially_paid 订单已收过一部分钱，不能结束；idempotency_conflict 同键不同内容；loyalty_conflict 会员入座的按座会话要从会员计时工作台（/loyalty/actions）操作 }
    delete:
      operationId: deleteServiceTableSession
      description: 撤销误开的未结账会话；这一台的草稿订单在同一事务里置为 voided（审计 order.voided），已付款的订单不受影响。已撤销的再撤销原样返回 204，不重复记审计。分笔付款已经收了一部分（订单为 partially_paid）的不能撤销，先收齐或对剩余免单。
      parameters: [{ $ref: '#/components/parameters/VenueSessionId' }]
      responses:
        '204': { description: 未结账桌位会话已取消，草稿订单已作废 }
        '409': { description: session_settled 已结算的会话不能取消；invalid_session_state 已结束（ended）的会话不能撤销；partially_paid 这一台的订单已经收了一部分款，不能撤销；loyalty_conflict 会员入座的按座会话要从会员计时工作台（/loyalty/actions）操作 }
  /sales-orders:
    get:
      operationId: listOrders
      description: >-
        员工的订单列表，新的在前（按创建时间，同一时刻按编号）。可按状态、关键字、结清方式（settlement=comp 只看免单）筛选；带 pageSize 时只回那一页，
        匹配总数与实际页码在 X-Total-Count、X-Page 响应头里（页码超出时落到最后一页）。不带 pageSize 时回全部匹配的订单。
        返回体始终是订单数组。
      parameters:
        - name: status
          in: query
          description: 订单状态；open 是「待结账」：还没收齐的单，草稿（draft）和部分付款（partially_paid）都在内
          schema: { type: string, enum: [draft, partially_paid, paid, refunded, voided, open] }
        - name: q
          in: query
          description: 关键字（最多 100 字，不分大小写）：匹配订单编号、明细名称、顾客昵称和打码后的手机号；完整手机号不参与匹配
          schema: { type: string, maxLength: 100 }
        - name: settlement
          in: query
          description: 结清方式：comp 只列免单结清的订单（单独可查，对账时和收款分开看）
          schema: { type: string, enum: [comp] }
        - { name: page, in: query, description: 从 1 起，配合 pageSize 使用, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 订单列表
          headers:
            X-Total-Count: { description: 带 pageSize 时：匹配的订单总数, schema: { type: integer } }
            X-Page: { description: 带 pageSize 时：实际返回的页码, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderList' }
        '400': { description: 状态、结清方式、页码或每页条数不合法 }
    post:
      operationId: createOrder
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '200':
          description: 当前会话已有还没收齐的订单（草稿，或分笔付款收了一部分的部分付款单），返回同一订单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '409': { description: session_closed 会话已结束或已有结算完成的订单；idempotency_conflict 幂等键对应不同请求 }
        '201':
          description: >-
            草稿订单已创建。带 venueSessionId 时按会话计时自动生成明细（开头这几行记在 autoLines，跟着计时重算）：
            时长正好等于某个已发布计时套餐则为该套餐一行；等于套餐时长加若干次续时则拆成套餐行与续时行；套餐的超时处理是
            按续时方案自动加收（overtime 为 renewal）且超时超过宽限时，另加一行「套餐名 · 超时加收」（续时价 × 块数）；
            自由计时发布了自由计时价时按已用时长分块（不足一块按一块），陪客发布了陪客费时带一行陪客费。
            对不上任何套餐、没发布自由计时价或陪客费时生成单价为 0 的占位行，名称写明时长，由员工在结账页填价——服务端不按分钟折算价格。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /sales-orders/{salesOrderId}:
    get:
      operationId: getOrder
      parameters: [{ $ref: '#/components/parameters/SalesOrderId' }]
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
    patch:
      operationId: updateOrder
      parameters:
        - { $ref: '#/components/parameters/SalesOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderUpdateInput' }
      responses:
        '409': { description: order_version_conflict 或 idempotency_conflict；重新读取并确认。order_closed 订单已不是草稿（部分付款、已结清或已撤销），明细不能再改。loyalty_conflict 会员入座的套餐订单按购买快照结算，不能改明细，其他消费单独建单。zero_receivable 已有的人工折扣会把改后的应收减到 0（整单不收钱用免单 createOrderComp） }
        '200':
          description: 草稿订单已更新
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /sales-orders/{salesOrderId}/customer:
    patch:
      operationId: setOrderCustomer
      description: >-
        给待结账（草稿）订单绑定、更换顾客账户，或改成散客（accountId 传 null）；店员、店长、老板都可以。
        绑定了顾客的订单走会员结账（loyalty/actions 的 quote、checkout），散客单直接登记线下收款。
        带读到的订单版本，过期回 409 order_version_conflict：保留输入、重新读取后由员工再确认，不自动重提。
        换了顾客订单版本随之改变，之前算的会员报价跟着作废（checkout 核对订单版本），要按新顾客重新报价。
        只改订单，不改它所属的计时会话。换成原来那位（或散客再改散客）时什么都不改、原样返回，也不记审计；
        真换了记审计 order.customer.changed：谁、哪张单、从谁换成谁（只写称呼与账户编号，不写手机号）。
      parameters:
        - { $ref: '#/components/parameters/SalesOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCustomerInput' }
      responses:
        '200':
          description: 已换成这位顾客（或散客），返回订单
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: invalid_request：没带 accountId、不是账户编号或版本格式不对；缺少幂等键时 idempotency_required }
        '403': { description: 不是员工 }
        '404': { description: not_found：订单或要绑定的顾客账户不存在 }
        '409':
          description: >-
            order_version_conflict 或 idempotency_conflict：重新读取并确认；order_closed：订单已不是待结账；
            loyalty_conflict：会员扫码入座的套餐订单，顾客由入座申请决定，不能更换
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /sales-orders/{salesOrderId}/payments:
    post:
      operationId: createOrderPayment
      description: >-
        收一笔线下款（现金、微信、支付宝）。一单可以分几笔收（多人合付）：每笔 1 分起、不超过还差的数（Order.outstandingCents），
        收齐（已收 + 免单 = 应收）订单就是 paid、计时会话随之结清；没收齐是 partially_paid（部分付款），可以接着收下一笔，
        或由店长、老板对剩余免单（createOrderComp）。收第一笔时商品出库、计时停在这一刻（同停止计时），计价与明细冻结：
        之后不再随时间重算，也不能改明细、折扣或换顾客。每笔带读到的订单版本：两个人同时收同一单，后到的版本已过期（409），不会超收；
        每笔一个幂等键，同键重放不会重复收。现金的实收与找零按这一笔算、记在这一笔上。
        关联了顾客、门店有会员规则的单，第一笔要走会员结账（loyalty/actions 的 checkout，会员价按整单定），之后余下的在这里分笔收。
      parameters:
        - { $ref: '#/components/parameters/SalesOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '400':
          description: >-
            invalid_request：收款金额超过还差的数（或应收为 0）、方式不对，或实收现金填得不对（不是现金、少于这笔金额、找零超过 ¥1,000），
            什么都不登记；缺少幂等键时 idempotency_required
        '409':
          description: order_version_conflict 或 idempotency_conflict 时重新读取并确认（计时费随时间变了——超时进了下一块、自由计时多了一块——也会这样，重读后按新金额收；别人刚收了一笔也会这样）；order_closed 订单已结清或已撤销；insufficient_stock 表示商品未入库或库存不足，不产生付款、出库或会话结清，核对明细及实际库存后重试；loyalty_conflict 待结账订单关联了顾客且门店有会员规则，第一笔要走会员结账（/loyalty/actions 的 quote、checkout）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '201':
          description: 付款记录已创建：收齐了订单为 paid（已结账），没收齐为 partially_paid（部分付款，outstandingCents 是还差的数）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /sales-orders/{salesOrderId}/refunds:
    post:
      operationId: createOrderRefund
      description: >-
        普通退款（店长、老板）：退员工选的那一笔付款（paymentId），每笔最多退「这笔金额 − 已退」（Payment.refundableCents）。
        分几笔收的单必须选；一笔收齐的单可以不带 paymentId。会员结账那一笔按原付款比例退回储值和积分，走 loyalty/actions 的 refund；
        免单那一笔没有收到钱，不能退。部分付款（还没收齐）的单不能退款：先收齐或对剩余免单。收到的钱都退完时订单为 refunded。
      parameters:
        - { $ref: '#/components/parameters/SalesOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundInput' }
      responses:
        '400': { description: invalid_request：金额超过这一笔还能退的（或订单的 refundableCents）、原因为空或超长、退回件数超出本单已售数量、商品没有库存资料、分几笔收的单没选退哪一笔、选的不是这一单的付款、订单还没收齐 }
        '403': { description: forbidden：只有店长、老板可以登记退款 }
        '409': { description: order_version_conflict 或 idempotency_conflict 时重新读取并确认；loyalty_conflict 表示退的是会员结账那一笔（Payment.member），须走会员退款（loyalty/actions refund，按原付款比例退）；comp_not_refundable 免单结清的订单、免单那一笔没有收到钱，不能退款 }
        '201':
          description: 退款记录已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /sales-orders/{salesOrderId}/discounts:
    post:
      operationId: createOrderDiscount
      parameters:
        - { $ref: '#/components/parameters/SalesOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderDiscountInput' }
      responses:
        '409': { description: order_version_conflict 或 idempotency_conflict；重新读取并确认。loyalty_conflict 会员入座的套餐订单按购买快照结算，不能减免。zero_receivable 这次折扣会把应收减到 0：应收为 0 的单收不了款，减免后至少留 1 分；整单不收钱用免单（createOrderComp，店长、老板，写明原因） }
        '201':
          description: 人工折扣记录已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
  /sales-orders/{salesOrderId}/comps:
    post:
      operationId: createOrderComp
      description: >-
        免单（店长、老板）：这一单不收钱、直接结清，必须写原因；分笔付款收了一部分（partially_paid）的单，也可以对剩余免单。
        免单是一条单独的结清记录（payments 里 method 为 comp、amountCents 为免掉的金额——就是此刻还差的 outstandingCents、
        reason 为原因），不是把人工折扣打到 100%（人工折扣仍不能把应收减到 0）：订单的应收照旧是原来的金额，实收（paidCents）不增加，
        免掉的部分没有可退的钱；一分没收、整单免单的 Order.settlement 为 comp。商品照常出库（部分付款的单收第一笔时已出库），
        计时会话随之结清；关联顾客的单也直接免单，不动会员资产（不扣余额积分、不送积分）。免掉的就是读到的这一版还差的数
        （带 expectedVersion），应收为 0 的单不用免单。记审计 order.comped（谁、免了多少、原因，收过钱的写明已收多少）。
      parameters:
        - { $ref: '#/components/parameters/SalesOrderId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompInput' }
      responses:
        '201':
          description: 已免单结清
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: invalid_request：原因为空或超过 200 字、应收为 0、会话已结束；缺少幂等键时 idempotency_required }
        '403': { description: forbidden：只有店长、老板可以免单 }
        '404': { description: not_found：订单不存在 }
        '409':
          description: >-
            order_version_conflict 或 idempotency_conflict 时重新读取并确认（计时费随时间变了也会这样：读到的金额已不是现在的应收）；
            order_closed：订单已结清或已撤销；insufficient_stock：商品未入库或库存不足，什么都不登记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /catalog-items:
    get:
      operationId: listCatalogItems
      description: 所有员工可读。带 barcode 时按条码精确查找（手机扫码入库、网页扫码枪）：找到是只有这一件的列表，没登记过是空列表。
      parameters:
        - name: barcode
          in: query
          required: false
          description: 商品条码，去掉首尾空白后按原样（区分大小写）精确匹配；格式见 CatalogInput.barcode
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: 员工商品目录，历史未命名项目 name 为空
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogItem' }
        '400': { description: invalid_barcode 带了 barcode 但为空或格式不对 }
        '403': { description: 非员工 }
    post:
      operationId: createCatalogItem
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogInput' }
      responses:
        '201':
          description: 店长或老板创建商品
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { description: invalid_catalog_item 名称为空或过长、价格缺失或超出范围；invalid_barcode 条码格式不对 }
        '403': { description: 无商品管理权限 }
        '409': { description: barcode_taken 条码已登记在别的商品上（message 写明是哪件商品），一个条码只能对应一件商品；idempotency_conflict 幂等键内容冲突 }
  /catalog-items/{catalogItemId}:
    patch:
      operationId: updateCatalogItem
      description: 店长或老板修改商品资料。只改带了的字段（至少一项），没带的保留原值；手机上给商品绑条码只带 barcode。条码有变化时审计 catalog.updated 记下原条码与新条码。
      parameters:
        - { name: catalogItemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogPatch' }
      responses:
        '200':
          description: 更新目录，不改变已保存订单明细和历史金额
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItem' }
        '400': { description: invalid_catalog_item 什么都没带、名称为空或过长、价格超出范围（没有名称的历史占位商品要先补名称）；invalid_barcode 条码格式不对 }
        '403': { description: 无商品管理权限 }
        '404': { description: 商品不存在 }
        '409': { description: barcode_taken 条码已登记在别的商品上（message 写明是哪件商品），一个条码只能对应一件商品；idempotency_conflict 幂等键内容冲突 }
  /stock-items:
    get:
      operationId: listInventoryItems
      responses:
        '200':
          description: 库存列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItemList' }
  /stock-items/{stockItemId}:
    patch:
      operationId: updateStockItemAlert
      description: 店长或老板修改预警线（库存不高于预警线即 lowStock）。只收 alertAt，数量只能经采购、盘点、结账和退款变动；预警线有变化时写审计 stock.alert_updated（原值与新值）。
      parameters:
        - { name: stockItemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockItemAlertInput' }
      responses:
        '200':
          description: 修改后的库存项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockItem' }
        '400': { description: invalid_stock_alert 预警线不是 0 到 1000000 的整数；invalid_request 带了其他字段或格式不对；idempotency_required 缺幂等键 }
        '403': { description: 店员、顾客无权修改 }
        '404': { description: 库存项目不存在 }
        '409': { description: idempotency_conflict 同一操作者用同一幂等键提交了不同内容 }
  /stock-receipts:
    post:
      operationId: createPurchase
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseInput' }
      responses:
        '201':
          description: 采购记录和库存流水已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseReceipt' }
        '400': { description: invalid_purchase 供应商或明细无效（商品编号须为 UUID） }
        '409': { description: idempotency_conflict 同一操作者用同一幂等键提交了不同内容 }
  /stock-receipts/prefill:
    get:
      operationId: getPurchasePrefill
      description: 收货入库表单的预填值（手机与网页共用）：最近一次入库的供应商、每件商品最近一次入库的进价。只是建议值，员工可改，入库接口不看它。所有员工可读。
      responses:
        '200':
          description: 预填值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchasePrefill' }
        '403': { description: 非员工 }
  /stock-adjustments:
    post:
      operationId: createInventoryAdjustment
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryAdjustmentInput' }
      responses:
        '201':
          description: 库存调整和库存流水已创建，返回调整后的库存数量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockAdjustmentResult' }
        '400': { description: invalid_adjustment 缺商品、变化量为 0、缺原因或 expectedQuantity 为负 }
        '404': { description: 库存项目不存在 }
        '409': { description: stock_quantity_conflict 带了 expectedQuantity 而当前库存已不是这个数（确认后有人结账、入库或盘点），未做任何变动，重读后让人重新核对；insufficient_stock 调整后为负；idempotency_conflict 同一操作者用同一幂等键提交了不同内容 }
  /stock-movements:
    get:
      operationId: listStockMovements
      description: 库存流水（采购入库、盘点调整、销售出库、退款回补、会员业务出入库），按发生时间倒序。流水只追加不改写。所有员工可读。
      parameters:
        - { name: stockItemId, in: query, required: false, description: 只看这个库存项目, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
        - { name: kind, in: query, required: false, description: 只看这一类流水, schema: { type: string, enum: [purchase, adjustment, sale, refund, loyalty] } }
        - { name: page, in: query, description: 分页约定同 /sales-orders, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 库存流水
          headers:
            X-Total-Count: { description: 带 pageSize 时：匹配的总条数, schema: { type: integer } }
            X-Page: { description: 带 pageSize 时：实际返回的页码, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockMovementList' }
        '400': { description: invalid_request 库存项目编号不是 UUID、流水类型或分页参数不对；invalid_date_range 日期格式不对或开始晚于结束 }
        '403': { description: 非员工 }
  /reports/exports/{kind}:
    get:
      operationId: getExport
      description: >-
        店长或老板导出 Excel。orders、refunds、purchases、movements 按门店日期筛选（含当天，不填不限）；
        inventory 是导出时的数量，不按日期。orders 的列为 id、status、receivable_cents（应收）、paid_cents（实收）、
        comp_cents（免单免掉的金额，没有为空）、comp_reason（免单原因）。movements 是库存流水，按发生时间从早到晚，列为
        时间（门店时区）、商品、类型（采购入库、盘点调整、销售出库、退款回补、会员出库、会员退回）、
        数量变化、原因（盘点）、供应商、采购备注、关联单号（采购单号、订单号或会员流水号）、操作人（员工当前昵称，早期流水为空）。
      parameters:
        - { $ref: '#/components/parameters/ExportKind' }
        - { $ref: '#/components/parameters/FromDate' }
        - { $ref: '#/components/parameters/ToDate' }
      responses:
        '200':
          description: Excel 文件
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '400': { description: invalid_date_range 日期格式不对或开始晚于结束 }
        '403': { description: 店员、顾客无权导出 }
        '500': { description: export_failed 生成 Excel 文件失败，可重试 }
  /system/data-exports:
    post:
      operationId: exportAllData
      description: >-
        老板下载当前全部业务数据的 JSON（账户含完整手机号、订单、库存、会员、预约、审计等，不含重放缓存和登录凭证），
        用于留底和技术排查，后台不能导回；每次下载记一条 data.exported 审计。应用内备份与恢复已退役
        （它们把整份数据存进内存和数据库，拖慢之后的每次写，而且业务历史只增不减、几乎无法恢复），灾难恢复用数据库备份。
      responses:
        '200':
          description: JSON 文件（Content-Disposition 为附件）
          content:
            application/json:
              schema: { type: object }
        '403': { description: 非老板 }
  /system/audit-events:
    get:
      operationId: listAuditLogs
      description: >-
        店长、老板读审计，新的在前。q 匹配动作代码、对象编号、请求号、原因、操作人编号，以及操作人的昵称或打码手机号（不区分大小写，%、_ 照字面）；
        actions 是逗号分隔的动作代码，满足其一即可（网页端把中文动作名换算成代码传来）。q 与 actions 同时给时满足任一即算匹配。
        分页约定同 /sales-orders：带 pageSize 只回那一页，总数与实际页码在 X-Total-Count、X-Page 响应头里；不带时回全部。
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: actions, in: query, description: 逗号分隔的动作代码, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 审计日志列表，仅授权角色可读取
          headers:
            X-Total-Count: { description: 带 pageSize 时：匹配的总条数, schema: { type: integer } }
            X-Page: { description: 带 pageSize 时：实际返回的页码, schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogList' }
        '400': { description: invalid_request 分页参数不对 }
        '403': { description: 店员、顾客无权读取 }
  /system/code-settings:
    get:
      operationId: getCodeSettings
      description: >-
        员工读桌码页要用的设置：小程序码（桌码、网页后台的登录码）指向的小程序版本，和网页桌码印的顾客域名地址
        （网页桌码在微信里扫，经「扫普通链接二维码打开小程序」的规则直接进小程序）。地址来自部署配置
        （PINDOU_CUSTOMER_WEB_HOSTS 的第一个域名），这里只读、不能改。
      responses:
        '200':
          description: 当前设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSettings' }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权读取 }
    patch:
      operationId: updateCodeSettings
      description: >-
        老板改小程序码指向的版本。改错了顾客扫桌码打不开入座页、员工扫不了网页后台的登录码，所以要写原因（记进审计
        miniprogram.env_changed，原因前面带「原版本 → 新版本：」），并带上确认时看到的版本 expectedEnvVersion。
        保存前用新版本试生成一次桌码和登录码，微信不收就不保存。改成现在的值什么都不做（不调微信、不记审计）。
        提交成功后推送 code-settings。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeSettingsInput' }
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodeSettings' }
        '400': { description: invalid_request 版本不认识、没写原因或原因超过 200 字 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 不是老板 }
        '409':
          description: >-
            code_settings_conflict 版本已不是 expectedEnvVersion（别人刚改过），刷新后重新确认；
            code_check_failed 用新版本试生成时微信拒绝了（多半是那个版本里没有入座页或登录批准页，例如正式版还没发布），
            message 带微信的 errcode，没有保存。
        '503': { description: wechat_unavailable 试生成时连不上微信，没有保存 }
  /system/billing-settings:
    get:
      operationId: getBillingSettings
      security: []
      description: >-
        门店开关「系统内收费」（2026-10-10 起）。门店的钱都在美团、大众点评收时关着：确认扫码入座、到店开台都不建套餐草稿单，
        员工点「结束」（/loyalty/actions 的 end、PATCH /venue-sessions/{venueSessionId} 的 end）结束计时并放座，桌位不给应收估算；
        结账、订单接口照旧在，前端不进。开着时照以前：建草稿单、结账才放座，「结束」返回 409 billing_enabled，没填价的套餐不能用来开台、预约。
        行为按操作那一刻的开关。不用登录：顾客端据此藏价格、把底部「订单」改成「我的预约」。老板没改过时是关。
      responses:
        '200':
          description: 当前开关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSettings' }
    patch:
      operationId: updateBillingSettings
      description: >-
        老板开关系统内收费：带确认时看到的状态 expectedEnabled，写原因（记进审计 billing.toggled，原因前面带「开 → 关：」这样的前后状态）。
        改成现在的值什么都不做（不记审计）。提交成功后推送 billing-settings（员工连接收到；顾客端下次打开页面时重读）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingSettingsInput' }
      responses:
        '200':
          description: 保存后的开关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingSettings' }
        '400': { description: invalid_request 没带 enabled、expectedEnabled，没写原因或原因超过 200 字 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 不是老板 }
        '409': { description: billing_settings_conflict 开关已不是 expectedEnabled（别人刚改过），刷新后重新确认 }
  /service-calls:
    get:
      operationId: listOpenServiceCalls
      description: >-
        员工（店员、店长、老板）看还没处理的呼叫：没处理、没过期（叫了不到 30 分钟）、顾客的计时还在进行或暂停中，先叫的在前。
        带顾客称呼；桌位编码与座号按会话现在的位置（顾客换了座也不会找错）。有员工点了「我去处理」的照样列出，带认领人与
        claimStatus（认领着的员工端不再振动、响铃，认领满 10 分钟没处理变回需要提醒）。全部历史会越积越大，不提供。
        新呼叫、认领与处理都推送 service-calls，收到后重读；认领失效是时间到了自然发生的，没有推送，靠定时重读。
      parameters:
        - name: scope
          in: query
          required: true
          description: 只能是 open
          schema: { type: string, enum: [open] }
      responses:
        '200':
          description: 未处理的呼叫
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCallList' }
        '400': { description: invalid_request 没带 scope 或取值不认识 }
        '401': { description: 未登录 }
        '403': { description: 不是员工 }
    post:
      operationId: createServiceCall
      description: >-
        顾客在小程序「本次手作」页呼叫店员。会话必须是本人的、计时中或暂停中（停止计时等结账的也算，会话状态仍是 active）；
        扫码入座的按座会话和员工开台时绑定了本人账户的整桌会话都可以，陪客不行。
        一个会话同时只有一条未处理的呼叫：已有没处理、没过期的就原样返回它（200），不新建；重复点、重发都无害，所以不用幂等键。
        店员处理后 1 分钟内不能再叫；没人处理的呼叫 30 分钟后显示为已过期，可以再叫。按账户限流（每分钟 10 次）。
        新建推送 service-calls（员工收到；顾客只收自己的）。响应不带顾客与处理人的称呼。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceCallInput' }
      responses:
        '201':
          description: 已呼叫
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCall' }
        '200':
          description: 这个会话已有一条还没处理的呼叫，原样返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCall' }
        '400': { description: invalid_request 没带合法的 venueSessionId }
        '401': { description: 未登录 }
        '409': { description: no_active_session 没有这个会话、不是本人的，或计时已结束（已结账、已撤销），不能呼叫 }
        '429':
          description: >-
            service_call_cooldown 店员刚处理过这个会话的呼叫，1 分钟内不能再叫；rate_limited 这个账户呼叫得太频繁。
            响应头 Retry-After 是还要等的秒数，什么都没写入
          headers:
            Retry-After: { required: true, description: 还要等的秒数, schema: { type: integer, minimum: 1 } }
  /service-calls/me:
    get:
      operationId: getMyServiceCalls
      description: >-
        顾客自己每个进行中（计时中或暂停中）会话最近的一条呼叫（按座会话与整桌会话都在内），「本次手作」页据此显示已呼叫、
        有店员正在过来（claimStatus 为 claimed，不说是哪位员工）、已处理与还要等多久才能再叫。没叫过的会话不在列表里；不带顾客、处理人与认领人的账户称呼。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCallList' }
        '401': { description: 未登录 }
  /service-calls/{serviceCallId}/handle:
    parameters:
      - { name: serviceCallId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: handleServiceCall
      description: >-
        员工（店员、店长、老板）标记已处理：记下谁、何时，写审计 service_call.handled。已经处理过的原样返回，不改处理人、
        不重复记审计（先点的那位算数），所以不用幂等键；过期的也能处理；别人点了「我去处理」的也能处理（处理人记实际点的那位）。
        推送 service-calls（员工与这位顾客都收到）。
      responses:
        '200':
          description: 已处理（带顾客、处理人与认领人的称呼）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCall' }
        '401': { description: 未登录 }
        '403': { description: 不是员工 }
        '404': { description: not_found 呼叫不存在 }
  /service-calls/{serviceCallId}/claim:
    parameters:
      - { name: serviceCallId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: claimServiceCall
      description: >-
        员工（店员、店长、老板）点「我去处理」认领这条呼叫：记下谁、何时，写审计 service_call.claimed。谁先认领算谁：
        别人认领着时回 409 service_call_claimed，什么都不改；同一人认领着再点原样返回、不重复记审计，所以不用幂等键。
        认领满 10 分钟还没处理，认领失效（claimStatus 变为 lapsed），重新提醒所有员工，谁都能再认领（原来那位再点就从现在重新计时）。
        认领不改呼叫本身的状态：「已处理」照旧谁都能点，结束这条呼叫。推送 service-calls（员工与这位顾客都收到）。
      responses:
        '200':
          description: 已认领（带顾客、处理人与认领人的称呼）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCall' }
        '401': { description: 未登录 }
        '403': { description: 不是员工 }
        '404': { description: not_found 呼叫不存在 }
        '409':
          description: >-
            service_call_claimed 别的员工认领着（不到 10 分钟），message 是「XX 已在处理」；
            service_call_closed 不用再去了：已处理、已过期或顾客已经结账离开
  /member-codes:
    post:
      operationId: issueMemberCode
      description: >-
        顾客在小程序会员中心亮出的会员码：给自己签发一个 90 秒有效的随机令牌，小程序把它画成二维码、每分钟换一个，
        截图转给别人很快就失效。令牌是 20 位数字（首位 9，其余 19 位随机），不含手机号、微信标识或账户编号；
        只有数字是为了柜台 USB 扫码枪当键盘输入时不被中文输入法截走。库里只存令牌的 SHA-256，新码不作废还没到期的旧码。
        任何已登录的人都能给自己签发（员工也是会员）。按账户限流（每分钟 20 次）。不推送事件。
      responses:
        '201':
          description: 已签发
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCode' }
        '401': { description: 未登录 }
        '429':
          description: rate_limited 签发得太频繁，响应头 Retry-After 是还要等的秒数
          headers:
            Retry-After: { required: true, description: 还要等的秒数, schema: { type: integer, minimum: 1 } }
  /member-codes/lookups:
    post:
      operationId: lookupMemberCode
      description: >-
        员工凭会员码查出是哪位顾客（小程序「扫会员码」、网页柜台扫码枪，或手机「扫码给电脑」转来的码）。只有员工能查，
        顾客查谁的码（包括自己的）都是 403。码在有效期内可以反复查。查到的写审计 member_code.scanned（对象是这位顾客的账户编号），
        查不到不记。返回员工侧要的摘要：称呼、打码手机号、员工任命和会员资产摘要（同 /accounts 与 /loyalty/members 的口径，不带头像）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 256, description: 扫到的内容原样给，首尾空白由后端去掉 }
      responses:
        '200':
          description: 这位顾客
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberCodeAccount' }
        '400': { description: invalid_request 没带 code }
        '401': { description: 未登录 }
        '403': { description: 不是员工 }
        '404': { description: member_code_not_found 不是本店的会员码（格式不对、伪造，或过期超过一小时已清理） }
        '410': { description: member_code_expired 会员码过期了，请顾客刷新会员码后再扫 }
  /scan-relays:
    post:
      operationId: relayScan
      description: >-
        手机当扫码枪：员工在小程序「扫码给电脑」扫到的码（商品条码、会员码，原样）转给本人此刻开着的电脑网页后台。
        经事件流推 {"type":"scan.relayed","code":"…"}，只推给同一员工账号的网页连接（网页会话），不推给别人、不推给小程序。
        码不落库：只经数据库的 NOTIFY 转一次，不进业务表、不记审计；网页那一刻没连着就收不到，不补发。
        电脑在线指这位员工有网页实时连接在 75 秒内报过到（网页连接每 30 秒报一次，记在 UNLOGGED 表 web_presences，断开即删）。
        只有员工能用。不推送资源事件。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 256, description: 扫到的内容原样给；去掉首尾空白后不能为空，不能含换行等控制字符 }
      responses:
        '200':
          description: 已转给本人开着的网页
          content:
            application/json:
              schema:
                type: object
                required: [computers]
                properties:
                  computers: { type: integer, minimum: 1, description: 收到的网页连接数（同一台电脑开了几个标签页就算几个） }
        '400': { description: invalid_request 没带 code，或内容为空、过长、含控制字符 }
        '401': { description: 未登录 }
        '403': { description: 不是员工 }
        '409': { description: computer_offline 本人没有开着的网页后台（电脑没在线），什么也没发 }
  /event-streams:
    get:
      operationId: connectEventStream
      description: >-
        写请求提交成功后推 {"type":"resource.updated","resource":"<路径第一段>"}，客户端收到后重新读取，不在本地推算状态。
        员工连接收全店事件；顾客连接只收改动了本人名下记录（订单、预约、会员流水与资料、入座申请、计时会话、呼叫店员、账户资料与任命）的事件。
        网页会话的连接另会收到 {"type":"scan.relayed","code":"…"}：本人在手机「扫码给电脑」扫到的码（见 /scan-relays），只发给本人的网页；
        网页员工连接每 30 秒在 web_presences 报一次到，断开时删掉，/scan-relays 据此判断电脑在不在线。
        每次推送前复查身份：会话失效、换了账户或员工身份有变时连接断开，客户端按新身份重连。
      responses:
        '200': { description: Bearer 鉴权 SSE，仅供开发诊断；事件内容与 WebSocket 相同 }
        '101': { description: 鉴权 WebSocket 升级。小程序用 Authorization 头；浏览器设不了这个头，改用子协议 Sec-WebSocket-Protocol 「pindou.v1, bearer.<令牌>」，服务端回显 pindou.v1。令牌不接受网址参数 }
        '401': { description: 未登录或会话过期 }

  /loyalty/public:
    get:
      operationId: getPublicLoyalty
      description: 游客可读已发布启用的规则，不含草稿。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoyaltyRule'
                required:
                - rules
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
      security: []
  /loyalty/me:
    get:
      operationId: getMyLoyalty
      description: >-
        只返回本人资产、权益与按座计时（扫码入座、到店开台，见 admissions）。积分余额按到期批次计算；流水按时间升序。
        员工从桌位开台、绑定了本人账户的整桌计时不在这里，见 /venue-sessions/me。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyMember'
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
  /loyalty/members:
    get:
      operationId: listLoyaltyMembers
      description: >-
        员工的会员列表：按关键字在库里筛选、分页，按昵称拼音排（同名按编号），每人带当前余额（只算这一页的人）。
      parameters:
        - name: q
          in: query
          description: 关键字（去掉首尾空白，不分大小写）：昵称或打码后的手机号包含它、账户编号以它开头，或完整手机号等于它
          schema: { type: string, maxLength: 100 }
        - { name: page, in: query, description: 从 1 起, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, description: 不带时每页 20 条, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 这一页的会员
          headers:
            X-Total-Count: { description: 匹配的总条数, required: true, schema: { type: integer } }
            X-Page: { description: 实际返回的页码（超出时落到最后一页）, required: true, schema: { type: integer } }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LoyaltyMemberSummary' }
        '400': { description: 页码或每页条数不合法 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 无权访问 }
  /loyalty/settings:
    get:
      operationId: getLoyaltySettings
      description: 规则设置：草稿、生效规则、发布记录（带发布人的称呼）与设置版本。规则类动作的 expectedVersion 用这里的 version。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltySettings' }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 无权访问 }
  /loyalty/shift:
    get:
      operationId: getLoyaltyShift
      description: 员工这一班要看的入座申请（带顾客称呼）与桌位占用。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                required: [admissions, tables]
                properties:
                  admissions:
                    type: array
                    items: { $ref: '#/components/schemas/LoyaltyAdmissionView' }
                  tables:
                    type: array
                    items: { $ref: '#/components/schemas/LoyaltyTable' }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 无权访问 }
  /loyalty/account:
    get:
      operationId: getAccountLoyalty
      description: 员工读取指定顾客的会员记录。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyMember'
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
      parameters:
      - in: query
        name: accountId
        required: true
        schema: &id001
          type: string
          format: uuid
  /loyalty/tables:
    get:
      operationId: getAdmissionTables
      description: 已登录顾客只读座位占用，不返回其他顾客身份。旧整桌会话占用全部座位。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LoyaltyTable'
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
  /loyalty/table-code:
    get:
      operationId: getTableMiniappCode
      description: >-
        员工为启用桌位生成微信小程序码，PNG/JPEG data URL。scene 为去连字符的桌 UUID，打开入座页 pages/customer/experience/index；
        指向的小程序版本由老板在 /system/code-settings 设置（没改过是体验版），指向正式版时那个版本里必须已有入座页。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageDataUrl:
                    type: string
                required:
                - imageDataUrl
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
        '503':
          description: 微信未配置、请求失败或指向的版本里没有入座页（message 带微信的 errcode）；不返回微信凭证
      parameters:
      - in: query
        name: tableId
        required: true
        schema: *id001
  /loyalty/actions:
    post:
      operationId: executeLoyaltyAction
      description: 按 action 执行会员、规则或计时操作；权限先于幂等重放校验。相同操作者、action、Idempotency-Key 和内容重放原结果；内容改变返回409。quote、refund_quote、preview_rule 也需幂等键，但只算不写，不产生资产流水、不存幂等记录。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoyaltyAction'
      responses:
        '200':
          description: 动作成功，按 action 返回对应资源
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoyaltyActionResult'
        '400':
          description: invalid_request 请求本身不对（含 checkout 的实收现金填得不对；会员退款金额超出还可退、没写原因、顾客与订单不符、退回件数超出售出数；fulfill_gift 指的不是生日礼物，如积分、折扣类生日福利或别的流水）；缺少幂等键时 idempotency_required
        '401':
          description: 未登录
        '403':
          description: 权限不足（含为他人设置生日、取消他人的申请）
        '404':
          description: not_found 目标顾客、规则草稿等不存在；fulfill_gift 时这位顾客名下没有这份生日礼物（含别的顾客领的）
        '409':
          description: >-
            loyalty_conflict（余额积分库存不足、规则或版本不符、座位冲突、续时会压到这个座位后面别人的预约、重复领取等）、order_version_conflict（refund 的 expectedVersion 不是订单当前版本）或 idempotency_conflict；刷新并由用户重新确认，不自动重提。
            fulfill_gift 另有两种：birthday_gift_fulfilled 这份生日礼物已经核销过（先于过期判断）；birthday_gift_expired 过了有效期（领取后 validDays 天），不能再核销。
            领取后生日规则停用不影响核销。礼物商品库存不足仍是 loyalty_conflict。
            end 另有两种：billing_enabled 系统内收费开着（请结账）；partially_paid 这一台的订单已收过一部分钱，先收齐或对剩余免单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 持久化失败，所有业务变更回滚；未知结果使用相同内容和幂等键重试
  /reservations/me:
    get:
      operationId: getMyReservations
      description: >-
        顾客读取本人预约、门店可预约设置（含老板填的门店电话、微信号）、计时套餐与座位占用。busy 只给出被占用的座位与时间段，不含其他顾客身份。
        closedDays 是从今天起的歇业日，日期条据此标「店休」；selfServiceSuspended 为 true 时本人因最近爽约次数达到上限暂停自助预约，页面提前说明并给出门店联系方式。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationView'
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
  /messages/me:
    get:
      operationId: getMyMessages
      description: >-
        顾客「消息」页：本人最近 90 天的会员流水（消费、充值、撤销、手动加减、兑换等，所有 kind 都算）和门店对本人预约做的事
        （门店确认、店员代客登记、门店取消；顾客自己取消的、员工给自己登记和取消的都不算，员工确认自己的预约算——照样发了微信「预约成功」通知；按发生过的事算，预约后来开台、爽约、取消，已有的那条照样在），按发生时刻从新到旧，最多 limit 条。只读不写；
        内容来自会员流水和预约本身，不另存消息，流水和预约有变化时随之变（实时事件照旧推 loyalty、reservations，前端收到后重读）。
        unread 按本人最后一次「看过」（POST /messages/me/reads）的时刻算，没看过时 90 天内的都算未读。员工身份读的也只是自己账户的。
      parameters:
      - name: limit
        in: query
        required: false
        description: 最多返回几条，默认 200；「我的」页只要最新一条和未读数时传 1
        schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageFeed'
        '400':
          description: invalid_request limit 不在 1–200
        '401':
          description: 未登录或会话已失效
  /messages/me/reads:
    post:
      operationId: markMyMessagesRead
      description: >-
        把本人消息全部记为已读：记下此刻（服务器时间），之后的才算未读。顾客打开「消息」页时调；重复调只是把时刻往后挪，不需要幂等键。
      responses:
        '204':
          description: 已记下
        '401':
          description: 未登录或会话已失效
  /reservations/staff:
    get:
      operationId: getStaffReservations
      description: >-
        员工读取预约，含顾客昵称与脱敏手机号；displayStatus 为按当前时间派生的展示状态，过期不改写已存状态。
        scope=open 是还要处理的（待确认、已确认，包括过了宽限期还没标记到店或爽约的，displayStatus 为 expired），按开始时间；
        scope=ended 是处理完的（已到店、已取消、爽约），开始时间新的在前分页，总数与实际页码在响应头里；带 date 时只要到店（开始）时间在门店这一天的。
        scope=open 另带 customerCancellations（今天被顾客自己取消、还没人点「知道了」的，现场页提醒用）。
        员工预约操作的响应与 scope=open 相同。
      parameters:
        - { name: scope, in: query, required: true, schema: { type: string, enum: [open, ended] } }
        - { name: page, in: query, description: 从 1 起, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, description: scope=ended 时有效，不带时每页 20 条, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: date, in: query, required: false, description: scope=ended 时有效：门店日期（中国标准时间），只要开始时间在这一天 0 点到次日 0 点之间的，总数也只数这些；不带时不限日期, schema: { type: string, format: date } }
      responses:
        '400': { description: invalid_request scope、页码、每页条数或日期不合法 }
        '200':
          description: 成功
          headers:
            X-Total-Count: { description: scope=ended 时：处理完的预约总数（带 date 时只数这一天的）, schema: { type: integer } }
            X-Page: { description: scope=ended 时：实际返回的页码, schema: { type: integer } }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationView'
        '401':
          description: 未登录或会话已失效
        '403':
          description: 无权访问
        '404':
          description: 资源不存在
  /reservations/{reservationId}/notices:
    parameters:
      - { name: reservationId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: subscribeReservationNotices
      description: >-
        顾客在小程序里允许了这条预约的微信订阅消息之后调用（2026-10-20 起，docs/plan-notify-and-share.md 第 3 节）：带一个新的 wx.login 登录码，
        后端换出 openid、核对这个微信就是账户绑定的那个，加密存下，记下允许了哪几种（kinds 按 ReservationView.noticeTemplates 里的种类，
        只带顾客在订阅框里点了允许的）。预约已经确认了的，confirmed 那种不再记；一种通知每条预约最多发一次，已经记过的再带不重复记。
        之后店员确认发「预约成功通知」、店员取消发「预约取消通知」、开始前 settings.remindHours 小时发「预约提醒通知」；顾客自己取消、爽约、到店开台后不再发。
        每个账户每 10 分钟最多 20 次。不涉及钱，不要 Idempotency-Key。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wechatLoginCode: { type: string, minLength: 1, maxLength: 2048, description: 新的 wx.login 登录码 }
                kinds:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { $ref: '#/components/schemas/ReservationNoticeKind' }
              required: [wechatLoginCode, kinds]
              additionalProperties: false
      responses:
        '200':
          description: 记好后本人的预约视图（同 /reservations/me）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationView' }
        '400': { description: invalid_request 没带登录码，或 kinds 不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: wechat_mismatch 现在的微信不是这个账户绑定的微信 }
        '404': { description: not_found 预约不存在或不是本人的 }
        '409': { description: notices_unavailable 门店没开顾客通知（noticeTemplates 为空时就是这样）；reservation_ended 预约已经结束（取消、爽约、到店或过了宽限期） }
        '429': { description: too_many_requests 开得太频繁 }
        '502': { description: wechat_unavailable 微信换登录码失败，请重试 }
  /reservations/actions:
    post:
      operationId: executeReservationAction
      description: >-
        按 action 预约、确认、取消、标记爽约、到店开台、点掉顾客取消的提醒（acknowledge）或保存预约设置；权限先于幂等重放校验。预约不收取任何款项，seat 通过既有按座计时流程生成会话，
        系统内收费开着时另建套餐草稿订单（关着时不建，员工点「结束」放座，见 /system/billing-settings）；预约里的团购记录带进这次入座。
        「到打烊」的套餐（LoyaltyRule.untilClose）预约从所选开始时间约到当天打烊，seat 从此刻算到打烊，已过打烊拒绝。
        系统内收费开着时，没填价（amountCents 为 0）的套餐不能 book、register、seat。
        seat 按现行发布的套餐从此刻起计时，坐满套餐时长会压到这个座位后面别人的预约时拒绝（reservation_conflict，说明写明是哪个预约）。
        待确认的预约也能直接 seat（2026-10-27 起，顾客已经到店）：不发「预约成功通知」，没发的通知作废。
        顾客扫码入座被确认、员工给有账户的顾客整桌开台时，这位顾客时间上重叠、还会到店的预约也记为已到店（不论约的是不是这个座位，约的就是这一座的优先），
        不再挂着过期、被当成爽约。
        acknowledge 只有员工能做、目标须是已取消的预约：员工在现场页的「顾客取消」提醒上点「知道了」，记一笔审计，之后 customerCancellations 不再列它（全店一起消掉）。
        只写了称呼、没关联账户的预约，seat 可以带 accountId 先关联再开台，也可以不带、当散客开台（2026-10-20 起）：散客走整桌开台
        （/venue-sessions 那种会话，按套餐时长定时、记下开台时的价，不建草稿单，结账时建单）；按座卖的多座桌仍要带 accountId，否则 409。
        顾客自助预约（book）每个账号同时最多 2 个还没到店的预约（待确认、已确认都算，含员工替他登记的）；不能约在歇业日（门店时区的日期落在
        settings.closedDates 或每周休息日 closedWeekdays）；最近爽约次数达到老板设的上限（noShowLimit 不为 0 时）暂停自助预约。
        顾客自助预约的时段也不能压到座位上正在进行的定时会话（到它的结束时间为止，含暂停；自由计时不挡）。
        员工代客登记（register）不受这四条限制。保存设置把某天设为歇业时，已经约在那天的预约不取消、不改状态。
        同一顾客同一时段只能有一条预约。相同操作者、action、Idempotency-Key 和内容重放原结果；内容改变返回409。
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationAction'
      responses:
        '200':
          description: 动作成功，返回操作者可见的预约视图与本次目标 targetId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationView'
        '400':
          description: 缺少幂等键（idempotency_required），或 DTO 无效、预约设置填得不对（invalid_request，如门店电话含字母、微信号有空格、新加的歇业日期早于今天、爽约次数超出范围）
        '401':
          description: 未登录
        '403':
          description: 权限不足
        '409':
          description: >-
            reservation_conflict（座位或时间段冲突、不在可预约范围、状态已变化、套餐已停用、设置版本不符等）或 idempotency_conflict；刷新并由用户重新确认，不自动重提。
            reservation_limit_reached：顾客自助预约时本账号已有 2 个还没到店的预约，小程序提示联系门店。
            store_closed：顾客自助预约的那天门店歇业。
            reservation_suspended：顾客最近爽约次数达到上限，暂停自助预约，小程序提示联系门店。
            seat_in_use：顾客自助预约的时段压到了座位上正在进行的定时会话，说明里写到几点空出。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 持久化失败，所有业务变更回滚；未知结果使用相同内容和幂等键重试
  /storefront:
    get:
      operationId: getStorefront
      security: []
      description: >-
        小程序首页一次读齐（2026-10-20 起，方案见 docs/plan-home-and-patterns.md），游客也能读：没过期的公告、门店联系方式与地址
        （取自预约设置）、今天的营业状态、今天还能约、本周上新。登录后的状态卡（正在店里、今天有预约）读 /venue-sessions/me、/reservations/me。
      responses:
        '200':
          description: 首页内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storefront' }
  /storefront/announcement:
    get:
      operationId: getAnnouncement
      description: 员工编辑公告时读：含已过期的，expired 标出是否过期。没有公告时 announcement 为 null。
      responses:
        '200':
          description: 当前公告
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementView' }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权读取 }
    patch:
      operationId: saveAnnouncement
      description: >-
        员工（店员、店长、老板）保存首页公告：文字去掉首尾空白后 200 字以内，可以换行；空文字表示清除。到期日可不填（不过期），填了不能早于今天
        （门店日期），到期那天还显示、过了那天不再显示。记审计 announcement.saved（原因是公告文字）或 announcement.cleared，提交成功后推送 storefront。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '200':
          description: 保存后的公告
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementView' }
        '400': { description: invalid_announcement 超过 200 字、到期日格式不对或早于今天；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
  /patterns:
    get:
      operationId: listPatterns
      security: []
      description: >-
        图纸库，按员工排的顺序（新传的在最前面）。不带 scope 时游客也能读：只有上架的图纸和启用的分类；scope=all 给员工，含下架的图纸和停用的分类。
        第一次上架起 7 天内 isNew 为 true（下架再上架不重算）。图片地址 imagePath、thumbnailPath 相对接口根地址（/api/v2），带图片版本。
      parameters:
        - { name: scope, in: query, required: false, description: all 给员工看全部（要登录员工账号）, schema: { type: string, enum: [all] } }
      responses:
        '200':
          description: 图纸与分类
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_request scope 不认识 }
        '401': { description: scope=all 时未登录或会话已失效 }
        '403': { description: scope=all 时顾客无权读取 }
    post:
      operationId: createPattern
      description: >-
        员工上传一张图纸，排在最前面。image 是 data URL（data:image/jpeg;base64,… 或 data:image/png;base64,…）：网页后台先在浏览器里缩到长边 1600 像素，
        原始字节不超过 1.4 MB（请求体上限 2 MB）、边长不超过 4096；服务器重新编码（去掉拍摄地点等元数据，长边超过 1600 再缩，1 MB 以内的 PNG 保留无损，其余存 JPEG）
        并生成长边 480 的 JPEG 缩略图。分类可不选（null）。published 为 true 时立即上架、记下第一次上架的时刻。记审计 pattern.created，推送 patterns。
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternInput' }
      responses:
        '201':
          description: 上传后的整个图纸库（同 scope=all）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_pattern 名字不对（1～20 个字）；invalid_pattern_image 不是 JPG、PNG，太大或尺寸太大；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权上传 }
        '409': { description: pattern_category_unavailable 分类不存在或已停用；idempotency_conflict 同键不同内容 }
  /patterns/{patternId}:
    parameters:
      - { name: patternId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePattern
      description: >-
        员工改一张图纸：只改带了的字段（名字、分类，categoryId 为 null 表示不分类；上下架；换图，要求同上传），至少一项。第一次上架时记下时刻，
        下架再上架不重记。有改动时记审计 pattern.updated（原因列出改了什么），推送 patterns。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternUpdate' }
      responses:
        '200':
          description: 修改后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_pattern 名字不对或没有要修改的内容；invalid_pattern_image 图片不对；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
        '404': { description: not_found 图纸不存在（可能刚被删了） }
        '409': { description: pattern_category_unavailable 分类不存在或已停用 }
    delete:
      operationId: deletePattern
      description: 员工删除一张图纸（图纸不是财务记录，可以删）。记审计 pattern.deleted（原因是名字），推送 patterns。
      responses:
        '200':
          description: 删除后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权删除 }
        '404': { description: not_found 图纸不存在 }
  /pattern-order:
    patch:
      operationId: orderPatterns
      description: 员工按给出的顺序重排全部图纸：ids 必须恰好是现有的全部图纸编号。顺序变了时记审计 pattern.reordered，推送 patterns。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SortOrderInput' }
      responses:
        '200':
          description: 重排后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
        '409': { description: order_outdated ids 和现有的图纸对不上（别人刚增删过），刷新后重新排 }
  /pattern-images/{patternId}/{size}:
    parameters:
      - { name: patternId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: size, in: path, required: true, description: full 原图，thumb 缩略图（JPEG）, schema: { type: string, enum: [full, thumb] } }
    get:
      operationId: getPatternImage
      security: []
      description: >-
        图纸图片本身，游客也能读（图片标签带不了令牌，编号是随机的 UUID；下架的也能读，网页后台要预览）。v 和现在的图片版本对得上时长期缓存
        （Cache-Control: public, max-age=31536000, immutable），对不上（换过图的旧地址）照样给现在的图但不缓存。带 ETag，If-None-Match 对得上回 304。
      parameters:
        - { name: v, in: query, required: false, description: 图片版本（列表里的地址自带）, schema: { type: string } }
      responses:
        '200':
          description: 图片
          headers:
            ETag: { required: true, schema: { type: string } }
            Cache-Control: { required: true, schema: { type: string } }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '304': { description: If-None-Match 对得上，没有变 }
        '404': { description: not_found 图纸不存在或 size 不认识 }
  /pattern-categories:
    post:
      operationId: createPatternCategory
      description: 员工加一个图纸分类（1～10 个字，不能重名），排在最后、启用。记审计 pattern_category.created，推送 patterns。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternCategoryInput' }
      responses:
        '201':
          description: 加好后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_pattern_category 名字不对；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
        '409': { description: pattern_category_taken 已经有同名的分类 }
  /pattern-categories/{categoryId}:
    parameters:
      - { name: categoryId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updatePatternCategory
      description: >-
        员工改分类的名字或启用、停用（停用后顾客端不出现，里面的图纸仍在「全部」里；有图纸的分类只能停用，空分类可以删）。有改动时记审计 pattern_category.updated，推送 patterns。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatternCategoryUpdate' }
      responses:
        '200':
          description: 修改后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_pattern_category 名字不对或没有要修改的内容；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
        '404': { description: not_found 分类不存在 }
        '409': { description: pattern_category_taken 已经有同名的分类 }
    delete:
      operationId: deletePatternCategory
      description: 员工删除一个空分类（里面没有图纸，含下架的），删了这个名字就能再用。记审计 pattern_category.deleted（原因是名字），推送 patterns。
      responses:
        '200':
          description: 删除后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权删除 }
        '404': { description: not_found 分类不存在 }
        '409': { description: pattern_category_in_use 分类里还有图纸（含下架的），说明里写着有几张；先把它们改到别的分类，或者停用这个分类 }
  /pattern-category-order:
    patch:
      operationId: orderPatternCategories
      description: 员工按给出的顺序重排全部分类：ids 必须恰好是现有的全部分类编号（含停用的）。顺序变了时记审计 pattern_category.reordered，推送 patterns。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SortOrderInput' }
      responses:
        '200':
          description: 重排后的整个图纸库
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatternLibrary' }
        '400': { description: invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
        '409': { description: order_outdated ids 和现有的分类对不上（别人刚加过），刷新后重新排 }
  /bead-settings:
    get:
      operationId: getBeadSettings
      security: []
      description: >-
        店里做图纸用的豆子（2026-10-20 起，方案见 docs/plan-bead-maker.md），游客也能读：顾客「做图纸」工具拿它当默认的色卡、底板和豆子大小，
        色卡选的是店里那套时标出店里有没有、在几号盒。只是默认值和提示，不限制顾客选别的。没设置过时 revision 为 0、updatedAt 为 null，
        其余是默认值（MARD 221 色都有、没有盒号、52 格底板、2.6 毫米豆）。色号和颜色值在仓库根 palettes/palettes.json。
      responses:
        '200':
          description: 店里的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeadSettings' }
    patch:
      operationId: saveBeadSettings
      description: >-
        员工（店员、店长、老板）保存店里做图纸用的豆子（整份替换）。expectedRevision 是读到的 revision（没设置过是 0），别人先改了回 409；
        和现在的一样时不写、不记审计，原样返回。available 为 null 表示这套色卡都有，选全了也存成 null；不为 null 时至少 2 种，按色卡顺序存。
        boxes 的盒号去掉首尾空白后 1～8 个字，空的丢掉。记审计 bead_settings.saved（原因概括色卡、颜色数、盒号数、底板和豆子），推送 bead-settings。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeadSettingsInput' }
      responses:
        '200':
          description: 保存后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeadSettings' }
        '400': { description: invalid_bead_settings 色卡不存在、色号不是这套色卡的或重复、颜色少于 2 种、盒号太长、底板或豆子大小不对；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '403': { description: 顾客无权修改 }
        '409': { description: bead_settings_conflict 别人刚改过，刷新后再改 }
  /bead-patterns:
    get:
      operationId: listBeadPatterns
      description: 我的图纸（「做图纸」工具存的），新改的在前，不带完整格子，列表用缩略格子 preview。只有本人能看，员工也看不到别人的。
      responses:
        '200':
          description: 我的图纸
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeadPatternList' }
        '401': { description: 未登录或会话已失效 }
  /bead-patterns/{beadPatternId}:
    parameters:
      - { name: beadPatternId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getBeadPattern
      description: 本人的一张图纸，含完整格子和拼完的格子。
      responses:
        '200':
          description: 图纸
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeadPattern' }
        '401': { description: 未登录或会话已失效 }
        '404': { description: not_found 没有这张图纸，或不是本人的 }
    patch:
      operationId: saveBeadPattern
      description: >-
        新建或保存本人的一张图纸（整张替换），编号由客户端生成（UUID）。expectedRevision 是读到的 revision，新建是 0；内容和现有的一样时原样返回（网络重试不算冲突），
        否则对不上回 409。后端核对格子，清掉空格子上的「拼完」位，算出 beads、doneBeads 和缩略格子。不涉及钱，不要幂等键；不记审计，不推实时事件。
        每个账户保存、删除合计 10 分钟最多 300 次。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeadPatternInput' }
      responses:
        '200':
          description: 保存后的图纸
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeadPattern' }
        '400': { description: invalid_bead_pattern 名字、色卡、宽高、颜色、格子或拼完的格子不对；invalid_request 格式不对 }
        '401': { description: 未登录或会话已失效 }
        '404': { description: not_found 编号不对或被别人的图纸占了 }
        '409': { description: bead_pattern_conflict 别处改过或删掉了（重新打开再改）；bead_pattern_limit 已经存满 30 张 }
        '429': { description: 太频繁（rate_limited），带 Retry-After }
    delete:
      operationId: deleteBeadPattern
      description: 删本人的一张图纸，不记审计。已经没有了也回 204。
      responses:
        '204': { description: 已删除 }
        '401': { description: 未登录或会话已失效 }
        '404': { description: not_found 编号不对 }
        '429': { description: 太频繁（rate_limited），带 Retry-After }
components:
  securitySchemes:
    MiniappBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    AccountId: { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
    ServiceTableId: { name: serviceTableId, in: path, required: true, schema: { type: string, format: uuid } }
    VenueSessionId: { name: venueSessionId, in: path, required: true, schema: { type: string, format: uuid } }
    SalesOrderId: { name: salesOrderId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportKind: { name: kind, in: path, required: true, schema: { type: string, enum: [orders, refunds, inventory, purchases, movements] } }
    FromDate: { name: from, in: query, required: false, description: 门店日期（中国标准时间），含当天, schema: { type: string, format: date } }
    ToDate: { name: to, in: query, required: false, description: 门店日期（中国标准时间），含当天, schema: { type: string, format: date } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, description: 缺少时回 400 idempotency_required, schema: { type: string, minLength: 1, maxLength: 255 } }
  schemas:
    MiniappVersionReport:
      type: object
      additionalProperties: false
      required: [envVersion, version]
      properties:
        envVersion: { type: string, enum: [release] }
        version: { type: string, maxLength: 32, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
    MiniappVersionStatus:
      type: object
      additionalProperties: false
      required: [release]
      properties:
        release:
          type: [object, 'null']
          additionalProperties: false
          required: [version, reportedAt]
          properties:
            version: { type: string }
            reportedAt: { type: string, format: date-time, description: 服务端最近收到员工正式版上报的时间，使用门店时区展示 }
    Storefront:
      type: object
      additionalProperties: false
      required: [announcement, contact, today, selfService, slots, featured]
      properties:
        announcement:
          type: [object, 'null']
          additionalProperties: false
          required: [body]
          description: 没过期的公告；没有公告或已过期为 null
          properties:
            body: { type: string, minLength: 1, maxLength: 200, description: 公告全文，可能有换行；首页只显示第一行 }
        contact: { $ref: '#/components/schemas/StoreContact' }
        today:
          type: object
          additionalProperties: false
          required: [date, status, opensAt, closesAt]
          properties:
            date: { type: string, format: date, description: 门店的今天 }
            status:
              type: string
              enum: [open, closed, day_off]
              description: open 营业中；closed 还没开门或已打烊；day_off 今天店休（歇业日期或每周休息日）
            opensAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: 每天开始时间（预约设置的 openMinute） }
            closesAt: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', description: 每天结束时间（closeMinute，最晚 24:00） }
        selfService: { type: boolean, description: 门店开着自助预约没有；关着时首页不显示「今天还能约」 }
        slots:
          type: array
          maxItems: 4
          description: >-
            今天还能约：从此刻往后、今天之内最近的几个整点（最多 4 个），口径同顾客自助下单——在可约范围里（开始结束时间、最短提前、时段粒度），
            时长按最短的已发布套餐（「到打烊」的按到打烊）。排不下最短套餐的整点跳过。关了自助预约或今天店休时为空。
          items:
            type: object
            additionalProperties: false
            required: [startAt, remaining]
            properties:
              startAt: { type: string, format: date-time }
              remaining: { type: integer, minimum: 0, description: 还能自助约上的位置数：平面图上的一个可约单位算一个（双人桌也是一个）；0 表示已满 }
        featured:
          type: array
          maxItems: 3
          description: 本周上新：上新的在前，不够按图纸顺序补；没有图纸时为空
          items: { $ref: '#/components/schemas/Pattern' }
    StoreContact:
      type: object
      additionalProperties: false
      required: [phone, wechat, address, latitude, longitude]
      description: 门店联系方式与地址，取自预约设置（老板在网页后台「营业与预约」填），没填的是空串或 null
      properties:
        phone: { type: string }
        wechat: { type: string }
        address: { type: string }
        latitude: { type: [number, 'null'], description: 纬度（GCJ-02），和经度一起填 }
        longitude: { type: [number, 'null'], description: 经度（GCJ-02） }
    AnnouncementView:
      type: object
      additionalProperties: false
      required: [announcement]
      properties:
        announcement:
          type: [object, 'null']
          additionalProperties: false
          required: [body, expiresOn, updatedAt, expired]
          properties:
            body: { type: string, minLength: 1, maxLength: 200 }
            expiresOn: { type: [string, 'null'], format: date, description: 到期日（门店日期，那天还显示）；不过期为 null }
            updatedAt: { type: string, format: date-time }
            expired: { type: boolean, description: 已过到期日、顾客看不到了 }
    AnnouncementInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, maxLength: 400, description: 公告文字，去掉首尾空白后 200 字以内；空串表示清除 }
        expiresOn: { type: [string, 'null'], description: 到期日 YYYY-MM-DD（门店日期），不能早于今天；不填或 null 表示不过期 }
    PatternCategory:
      type: object
      additionalProperties: false
      required: [id, name, enabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 10 }
        enabled: { type: boolean, description: 停用的分类顾客端不出现 }
    Pattern:
      type: object
      additionalProperties: false
      required: [id, name, categoryId, published, isNew, firstPublishedAt, width, height, updatedAt, imagePath, thumbnailPath]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 20 }
        categoryId: { type: [string, 'null'], format: uuid, description: 不分类为 null；分类可能已停用 }
        published: { type: boolean, description: 上架了没有（顾客只看到上架的） }
        isNew: { type: boolean, description: 上架中、且第一次上架起不满 7 天 }
        firstPublishedAt: { type: [string, 'null'], format: date-time, description: 第一次上架的时刻；没上过架为 null }
        width: { type: integer, minimum: 1, description: 原图宽（像素） }
        height: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        imagePath: { type: string, description: 原图地址，相对接口根地址（/api/v2），带图片版本 }
        thumbnailPath: { type: string, description: 缩略图（长边 480 的 JPEG）地址，相对接口根地址 }
    BeadSettings:
      type: object
      additionalProperties: false
      required: [palette, available, boxes, boardSize, beadSize, revision, updatedAt]
      properties:
        palette: { type: string, description: 色卡编号，见 palettes/palettes.json }
        available:
          type: [array, 'null']
          description: 店里有的色号（按色卡顺序）；null 表示这套色卡都有
          items: { type: string }
        boxes:
          type: object
          description: 色号 → 盒号，没填的不出现
          additionalProperties: { type: string }
        boardSize: { type: integer, minimum: 10, maximum: 150, description: 底板一边几格 }
        beadSize: { type: string, enum: [mini, midi], description: mini 是 2.6 毫米，midi 是 5 毫米 }
        revision: { type: integer, minimum: 0, description: 每保存一次加一；0 表示没设置过 }
        updatedAt: { type: [string, 'null'], format: date-time }
    BeadSettingsInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, palette, available, boxes, boardSize, beadSize]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        palette: { type: string }
        available:
          type: [array, 'null']
          items: { type: string }
        boxes:
          type: object
          additionalProperties: { type: string, maxLength: 32 }
        boardSize: { type: integer, minimum: 10, maximum: 150 }
        beadSize: { type: string, enum: [mini, midi] }
    BeadPatternSummary:
      type: object
      additionalProperties: false
      required: [id, name, palette, width, height, colors, preview, previewWidth, previewHeight, beads, doneBeads, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        palette: { type: string }
        width: { type: integer }
        height: { type: integer }
        colors: { type: array, items: { type: string }, description: 用到的色号，格子里的序号指向它 }
        preview: { type: string, description: 缩略格子，长边不超过 32，同 cells 的字符 }
        previewWidth: { type: integer }
        previewHeight: { type: integer }
        beads: { type: integer, description: 有豆子的格数 }
        doneBeads: { type: integer, description: 其中拼完的格数 }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BeadPatternList:
      type: object
      additionalProperties: false
      required: [patterns, limit]
      properties:
        patterns:
          type: array
          description: 新改的在前
          items: { $ref: '#/components/schemas/BeadPatternSummary' }
        limit: { type: integer, description: 一个账户最多存几张（30） }
    BeadPattern:
      type: object
      additionalProperties: false
      required: [id, name, palette, width, height, colors, cells, done, beads, doneBeads, revision, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        palette: { type: string }
        width: { type: integer }
        height: { type: integer }
        colors: { type: array, items: { type: string } }
        cells: { type: string, description: 按行每格一个字符：「.」是空，0-9、a-z、A-Z、_、- 依次是 colors 的第 0～63 个 }
        done: { type: string, description: 拼完的格子，按行的位图（第 i 格是第 i/8 字节的第 i%8 位）标准 base64；空串表示一格都没拼 }
        beads: { type: integer }
        doneBeads: { type: integer }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BeadPatternInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, name, palette, width, height, colors, cells, done]
      properties:
        expectedRevision: { type: integer, minimum: 0, description: 读到的 revision，新建是 0 }
        name: { type: string, minLength: 1, maxLength: 40, description: 去掉首尾空白后 1～20 个字 }
        palette: { type: string }
        width: { type: integer, minimum: 4, maximum: 300 }
        height: { type: integer, minimum: 4, maximum: 300 }
        colors: { type: array, maxItems: 64, items: { type: string }, description: 这套色卡里的色号，不重复 }
        cells: { type: string, minLength: 16, maxLength: 90000, description: 正好 width×height 个字符，同 BeadPattern.cells }
        done: { type: string, description: 同 BeadPattern.done }
    PatternLibrary:
      type: object
      additionalProperties: false
      required: [categories, patterns]
      properties:
        categories:
          type: array
          description: 按员工排的顺序；顾客看的只有启用的
          items: { $ref: '#/components/schemas/PatternCategory' }
        patterns:
          type: array
          description: 按员工排的顺序；顾客看的只有上架的
          items: { $ref: '#/components/schemas/Pattern' }
    PatternInput:
      type: object
      additionalProperties: false
      required: [name, categoryId, published, image]
      properties:
        name: { type: string, minLength: 1, maxLength: 40, description: 去掉首尾空白后 1～20 个字 }
        categoryId: { type: [string, 'null'], format: uuid, description: 启用的分类；不分类为 null }
        published: { type: boolean, description: 立即上架；false 先存着 }
        image: { type: string, minLength: 1, description: 'data:image/jpeg;base64,… 或 data:image/png;base64,…，原始字节不超过 1.4 MB' }
    PatternUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        categoryId: { type: [string, 'null'], format: uuid, description: 改分类；null 表示不分类 }
        published: { type: boolean, description: 上架或下架 }
        image: { type: string, minLength: 1, description: 换图，要求同上传 }
    PatternCategoryInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 20, description: 去掉首尾空白后 1～10 个字 }
    PatternCategoryUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 20 }
        enabled: { type: boolean }
    SortOrderInput:
      type: object
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          description: 全部编号，按新的顺序（排在前面的先显示）
          items: { type: string, format: uuid }
    BackupRun:
      type: [object, 'null']
      required: [name, sizeBytes, finishedAt]
      properties:
        name: { type: string, example: pindou_20261005T031500+0800.dump }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        finishedAt: { type: string, format: date-time }
    WechatSessionInput:
      type: object
      required: [wechatLoginCode]
      properties:
        wechatLoginCode: { type: string, minLength: 1, maxLength: 2048 }
    WebLoginChallenge:
      type: object
      required: [id, status, createdAt, expiresAt, userAgent, ip]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, used, expired], description: expired 是按时间算出的展示状态 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        userAgent: { type: string, description: 发起网页的浏览器标识，最多 200 字 }
        ip: { type: string, description: 发起网页的来源地址 }
    WechatSession:
      type: object
      required: [accessToken, expiresAt, user]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/Account' }
    AccountRegistrationInput:
      type: object
      required: [wechatLoginCode, nickname, privacyContractVersion]
      properties:
        wechatLoginCode: { type: string, minLength: 1, maxLength: 2048 }
        nickname: { type: string, minLength: 1, maxLength: 50 }
        avatarDataUrl: { type: string, maxLength: 131100, description: 可选的本人 JPEG 或 PNG base64 data URL；解码后最多 96 KiB、边长不超过 512px，服务端重新编码 JPEG 并随账户一起保存。省略或空字符串不设置头像，非法图片返回 400 invalid_avatar 且不创建账户或会话。 }
        phoneCode: { type: string, minLength: 1, maxLength: 2048 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        privacyContractVersion: { type: string, minLength: 1, maxLength: 100 }
    PasswordReset:
      type: object
      required: [temporaryPassword, expiresAt, phoneMasked]
      properties:
        temporaryPassword: { type: string, pattern: '^[0-9]{8}$', description: 8 位数字，只在这次响应里出现，当面告诉顾客 }
        expiresAt: { type: string, format: date-time }
        phoneMasked: { type: string, description: 认领用的手机号（打码），员工核对是不是顾客报的号 }
    AccountUpdateInput:
      type: object
      additionalProperties: false
      properties:
        nickname: { type: string, minLength: 1, maxLength: 50 }
        avatarDataUrl: { type: string, maxLength: 131100, description: 本人选择的 JPEG 或 PNG base64 data URL；解码后最多 96 KiB、边长不超过 512px；服务端重新编码 JPEG；空字符串清除，省略保留。仅本人可修改。 }
        phone: { type: string, minLength: 1, maxLength: 30, description: 手动填写的手机号，写入后 phoneVerificationStatus 为 unverified。与 phoneCode 互斥。 }
        phoneCode: { type: string, minLength: 1, maxLength: 2048, description: 微信 getPhoneNumber 返回的 code，服务端换取手机号后 phoneVerificationStatus 为 verified。与 phone 互斥；仅本人可用，代改他人返回 403；向微信换号失败返回 502 wechat_unavailable。 }
    DeveloperMode:
      type: string
      enum: [developer, guest, customer, clerk, manager, owner]
      description: developer 为开发者新登录的待选择状态，不授予门店管理权限；接口保留该值兼容已有客户端，当前小程序不将其列为可选角色。guest 为游客体验，保留读取本人会话资料和切换身份入口，其他受保护资源按未登录拒绝；customer 仅有本人顾客权限。
    Account:
      type: object
      required: [id, nickname, phoneVerificationStatus, roles]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        avatarDataUrl: { type: string, maxLength: 131100, description: 已重新编码的 JPEG base64 data URL；未设置头像时省略，账号搜索列表可省略。 }
        phoneMasked: { type: string }
        phoneVerificationStatus: { type: string, enum: [verified, unverified] }
        roles:
          type: array
          description: 本人会话资料返回当前有效角色；账号列表和他人资料返回持久员工任命。
          items: { type: string, enum: [clerk, manager, owner] }
        developerMode:
          $ref: '#/components/schemas/DeveloperMode'
          description: 仅已配置开发者本人的登录、切换和本人资料响应提供。新登录默认 developer，不持久化至用户或备份。
    AccountLabel:
      type: [object, 'null']
      description: 列表里给人看的账户称呼，只供展示，不是权限依据，也不进入任何 version
      required: [id, nickname, phoneMasked]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        phoneMasked: { type: string }
    AccountList:
      type: array
      items: { $ref: '#/components/schemas/Account' }
    StaffRoleAssignmentInput:
      type: object
      required: [accountId, role]
      properties:
        accountId: { type: string, format: uuid }
        role: { type: string, enum: [clerk, manager, owner] }
    StaffRoleAssignmentCreated:
      type: object
      description: 新建的任命。不带被任命账户的称呼（列表里才有）。
      required: [id, accountId, role, assignedAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        role: { type: string, enum: [clerk, manager, owner] }
        assignedAt: { type: string, format: date-time }
    StaffRoleAssignment:
      description: 任命列表的一项，带被任命账户的称呼（账户不在了为 null）。
      allOf:
        - { $ref: '#/components/schemas/StaffRoleAssignmentCreated' }
        - type: object
          required: [account]
          properties:
            account: { $ref: '#/components/schemas/AccountLabel' }
    StaffRoleAssignmentList:
      type: array
      items: { $ref: '#/components/schemas/StaffRoleAssignment' }
    FloorArea:
      type: object
      description: 平面图上的一个分区，名称由门店布局决定。
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    FloorAreaList:
      type: array
      items: { $ref: '#/components/schemas/FloorArea' }
    ServiceTableUpdateInput:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: boolean }
    ServiceTable:
      type: object
      required: [id, code, zone, floorAreaId, number, seatCount, wholeTable, enabled, occupancy, seatBased]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, description: '门店布局里的稳定编码（A1、B3…，见 layout/store-layout.json），桌上贴的就是它；桌号只在区域内唯一' }
        zone: { type: string, description: 分区字母，由 code 推出 }
        floorAreaId: { type: string, format: uuid }
        number: { type: integer, minimum: 1 }
        seatCount: { type: integer, minimum: 1, maximum: 99 }
        wholeTable: { type: boolean, description: 整张桌一次只卖给一组客人（包间 D 区的双人桌） }
        enabled: { type: boolean }
        occupancy: { type: string, enum: [idle, occupied] }
        seatBased: { type: boolean, description: 包含按座会话时为 true，员工应进入会员计时工作台；计时摘要取最早到期的活动座位 }
        timingMode: { type: string, enum: [free], description: 桌上有自由计时的会话时为 free；没有时省略 }
        startedAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        remainingSeconds: { type: integer, minimum: 0 }
        timingStatus: { type: string, enum: [running, expiring, overdue], description: 按最早到期的会话算的提醒档；已停止计时的会话按停止那一刻算，两端不再提醒（见 stopped） }
        stopped: { type: boolean, enum: [true], description: 桌上进行中的会话都已停止计时、保留座位等结账（按座会话、整桌会话都算）：桌位页写「待结账」，不提醒快到点、超时。有还在计时的会话或空闲时省略 }
        estimatedCents: { type: integer, minimum: 1, description: 按当前计时与已发布的价（套餐、续时与超时加收、自由计时价、陪客费）估出的计时费，供员工在会话页直接报价；与 charge.totalCents 相同。对不上套餐、没发布自由计时价或陪客费、同桌多个会话时省略该字段——缺字段表示「结账时填价」，不是不收费，不下发 0。分笔付款已经收了一部分（订单为 partially_paid）的会话也省略：整单的计时费不是还要收的数，还差多少看订单的 outstandingCents。系统内收费关着时（见 /system/billing-settings）一律省略。 }
        charge:
          allOf: [{ $ref: '#/components/schemas/SessionCharge' }]
          description: 桌上只有一个会话时给出：这次计时此刻怎么计价（后端算好的说明，两端原样显示）。同桌多个会话、系统内收费关着时省略
    ServiceTableList:
      type: array
      items: { $ref: '#/components/schemas/ServiceTable' }
    ServiceTableSplitInput:
      type: object
      required: [serviceTableId, newTableCount]
      properties:
        serviceTableId: { type: string, format: uuid }
        newTableCount: { type: integer, minimum: 2, maximum: 99 }
    ServiceTableSessionInput:
      type: object
      required: [serviceTableId, timingMode]
      properties:
        serviceTableId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time, description: 回填的开始时间。员工选「现在」时省略，由服务器取当前时间（不看设备时钟）；带了的，比服务器时间晚 2 分钟以内的也按服务器的「现在」算（设备时钟稍快），更晚的仍按未来时间拒绝 }
        timingMode: { type: string, enum: [timed, free] }
        durationMinutes: { type: integer, minimum: 1, description: timed 模式必填（开到打烊的除外）；free 模式省略 }
        untilClose: { type: boolean, enum: [true], description: 开到当天打烊（「到打烊」的套餐）：timingMode 为 timed、不带 durationMinutes，服务器按开始时间算到打烊（「营业与预约」的每天结束时间）还有多少分钟，不足一分钟按一分钟。已到或过了打烊返回 409 past_closing。返回的会话带 untilClose 表示这一台用到打烊为止（按座会话用的是「到打烊」的套餐时也带）：结束时间固定在打烊，不能暂停、续时、标陪客（status companion）、改时长或计时方式（PATCH 返回 409 invalid_session_state），改开始时间时时长跟着重算到打烊 }
    ServiceTableSessionUpdateInput:
      type: object
      properties:
        serviceTableId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time, description: 改开始时间；比服务器时间晚 2 分钟以内的按服务器的「现在」算 }
        timingMode: { type: string, enum: [timed, free] }
        durationMinutes: { type: integer, minimum: 1, description: 新的总时长（绝对值）。旧写法，续时请用 extendMinutes；free 模式省略 }
        extendMinutes: { type: integer, minimum: 1, maximum: 1440, description: 续时：在当前时长上追加的分钟数。须同时给 expectedDurationMinutes 并带 Idempotency-Key，不能与 durationMinutes 同时给；自由计时不能续时 }
        expectedDurationMinutes: { type: integer, minimum: 1, description: 员工确认时看到的当前时长（前置条件）；与会话当前时长不符（或会话已是自由计时）返回 409 session_conflict }
        status: { type: string, enum: [active, paused, companion], description: 陪客会话（companion）不能再改成 paused 或 active }
        stop: { type: boolean, enum: [true], description: 停止计时：停在这一刻、计价冻结，座位保留到结账。须带 Idempotency-Key，不能和其他字段一起给；陪客、已停止的会话不能停止 }
        end: { type: boolean, enum: [true], description: 结束并放座（系统内收费关着时）：结束计时（已停止计时的保留原来的停止时刻），会话状态改为 ended，座位和预约占用立刻放开；这一台的草稿订单一并作废。须带 Idempotency-Key，不能和其他字段一起给；所有员工都能办。系统内收费开着时返回 409 billing_enabled（请结账），订单已收过一部分钱时返回 409 partially_paid }
    ServiceTableSessionUpdateResult:
      allOf:
        - { $ref: '#/components/schemas/ServiceTableSession' }
        - type: object
          properties:
            draftOrder:
              type: object
              description: 只在时长、计时方式变化或标记陪客且这一台已有草稿订单时给出：草稿有没有按新的计时改价
              required: [id, repriced, receivableCents]
              properties:
                id: { type: string, format: uuid }
                repriced: { type: boolean, description: true 已按新计时换掉系统生成的计时明细并重算；false 计时明细被员工改过，没有自动改价，请到结账页核对 }
                receivableCents: { type: integer, minimum: 0, description: 草稿现在的应收 }
    ServiceTableSession:
      allOf:
        - { $ref: '#/components/schemas/ServiceTableSessionInput' }
        - type: object
          # 开台时开始时间可以不传（由服务器取当前时间），返回的会话总带开始时间
          required: [id, status, startedAt]
          properties:
            id: { type: string, format: uuid }
            startedAt: { type: string, format: date-time }
            status: { type: string, enum: [active, paused, companion, cancelled, settled, ended], description: 'cancelled 撤销开台；settled 收款或免单结清；ended 系统内收费关着时员工点「结束」放座（没经过收款）。只有 active、paused、companion 是进行中、占座' }
            seatNumber: { type: integer, minimum: 1, description: 新按座会话的座号；旧整桌会话省略 }
            admissionId: { type: string, format: uuid }
            stoppedAt: { type: string, format: date-time, description: 已停止计时、保留座位等结账（状态仍是 active）：计价按这一刻冻结。按座会话由 /loyalty/actions 的 stop 停止，整桌会话由 PATCH 的 stop 停止。结清、结束（ended）的会话是计时停下的时刻 }
            pausedAt: { type: string, format: date-time, description: 当前暂停的开始时间，仅暂停中返回 }
            pausedSeconds: { type: integer, minimum: 0, description: 已完成暂停累计秒数，不计入使用时长 }
            renewal:
              type: object
              description: >-
                整桌定时会话的续时方案（只在 /venue-sessions 的响应里）：开台时记下的价里，眼下的约定时长（含已续的）对得上的套餐
                的续时方案——先找时长正好相等、有续时方案的套餐，再找「套餐 + 若干次续时」对得上的。按它续整块（minutes 的整数倍）后
                仍对得上套餐加续时、照样有价；两端的续时给「续 N 分钟」（N 为 minutes 的 1、2、3 倍），另可自己填分钟（对不上的结账时填价）。
                不能续时（自由计时、到打烊、已停止计时、陪客、已结束）、对不上套餐或套餐没有续时方案时省略；按座会话的续时方案在入座申请的套餐里，这里也省略
              required: [minutes, amountCents, packageName]
              properties:
                minutes: { type: integer, minimum: 1, description: 一次续多少分钟 }
                amountCents: { type: integer, minimum: 0, description: 一次续时的价（开台时记下的），只作说明；记进订单多少以后端计价为准。系统内收费关着时前端不显示 }
                packageName: { type: string, description: 这条续时方案所属的套餐名 }
    ServiceTableSessionList:
      type: array
      items: { $ref: '#/components/schemas/ServiceTableSession' }
    MyVenueSession:
      type: object
      description: >-
        顾客看的一次整桌计时。剩余、超时与提醒档同桌位接口（ServiceTable 的 endsAt、remainingSeconds、timingStatus）的算法，
        按读取时刻算好；前端只在两次重读之间倒数显示，不自己判。
      required: [id, serviceTableId, tableCode, startedAt, timingMode, displayStatus, elapsedSeconds, canCallStaff]
      properties:
        id: { type: string, format: uuid, description: 会话编号；呼叫店员时作为 venueSessionId }
        serviceTableId: { type: string, format: uuid }
        tableCode: { type: string, description: '桌位在布局里的编码（A1、B3…），桌上贴的就是它' }
        startedAt: { type: string, format: date-time }
        timingMode: { type: string, enum: [timed, free] }
        durationMinutes: { type: integer, minimum: 1, description: 定时的约定时长（员工续过时的是续过之后的）；自由计时省略 }
        displayStatus:
          type: string
          enum: [running, paused, companion, stopped]
          description: running 计时中；paused 暂停中（时间不走）；companion 陪客；stopped 已停止计时、等结账
        elapsedSeconds: { type: integer, minimum: 0, description: 已用秒数，扣掉暂停；定时的已用加剩余正好是约定时长 }
        endsAt: { type: string, format: date-time, description: 定时的结束时间，暂停的时间顺延；自由计时省略 }
        remainingSeconds: { type: integer, minimum: 0, description: 还剩多少秒，超时后为 0；自由计时省略 }
        overdueSeconds: { type: integer, minimum: 0, description: 超时了多少秒，没超时为 0；自由计时省略 }
        timingStatus:
          type: string
          enum: [running, expiring, overdue]
          description: 定时的提醒档：剩余 10 分钟以内 expiring，过了结束时间 overdue；自由计时省略
        canCallStaff: { type: boolean, description: 此刻能不能为这次计时呼叫店员（计时中、暂停中，含停止计时等结账；陪客不能），与 POST /service-calls 同一条规则 }
    MyVenueSessionList:
      type: array
      items: { $ref: '#/components/schemas/MyVenueSession' }
    OrderInput:
      type: object
      properties:
        venueSessionId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
    OrderUpdateInput:
      type: object
      required: [expectedVersion, lines]
      properties:
        expectedVersion: { $ref: '#/components/schemas/OrderVersion' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
    OrderCustomerInput:
      type: object
      required: [expectedVersion, accountId]
      properties:
        expectedVersion: { $ref: '#/components/schemas/OrderVersion' }
        accountId:
          type: [string, 'null']
          format: uuid
          description: 要绑定的顾客账户；null 表示改成散客。必须写出来，不能省略
    OrderLine:
      type: object
      required: [quantity, unitPriceCents]
      properties:
        productId: { type: string, format: uuid, description: 商品明细关联的商品编号，付款时校验并扣减库存；自定义计时或服务费省略此字段，不扣库存。创建商品资料不会自动入库。 }
        name: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPriceCents: { type: integer, minimum: 0 }
    OrderDiscount:
      type: object
      required: [id, kind, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [fixed, percentage] }
        reason: { type: string }
        amountCents: { type: integer, minimum: 1 }
        rateBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
        createdAt: { type: string, format: date-time }
    Payment:
      type: object
      description: >-
        一笔付款（按收款先后排）。一单可以分几笔收（多人合付），每笔各记方式与金额；免单（comp）也是一条，记免掉的金额。
      required: [id, method, amountCents, createdAt]
      properties:
        id: { type: string, format: uuid }
        method:
          type: string
          enum: [cash, wechat, alipay, balance, comp]
          description: comp 是免单：不是收到的钱，amountCents 是免掉的金额，不计入 paidCents、不能退款；对账时和收款分开列
        amountCents: { type: integer, minimum: 1 }
        reason: { type: string, description: 只有免单（comp）才有：店长、老板写的免单原因 }
        createdAt: { type: string, format: date-time }
        member:
          type: boolean
          description: >-
            会员结账那一笔里的付款（储值，和随会员结账一起收的线下补付）才有，为 true：这几条一起按原付款比例退
            （loyalty/actions 的 refund，还能退多少见 memberCheckout.refundableCents）。其余付款没有这个字段
        refundedCents:
          type: integer
          minimum: 0
          description: 这笔已退多少。只在已付款（含部分退款）、已退款订单的现金、微信、支付宝付款上（不含会员结账那一笔），只供展示，不进入 version
        refundableCents:
          type: integer
          minimum: 0
          description: 这笔还能退多少（这笔金额 − 已退），普通退款（createOrderRefund 带 paymentId）的上限。出现条件同 refundedCents
        cashReceivedCents:
          type: integer
          minimum: 1
          description: 现金收款时员工填的实收现金（顾客给了多少），不小于 amountCents。没填或不是现金时不下发；与 changeCents 同时出现
        changeCents:
          type: integer
          minimum: 0
          maximum: 100000
          description: 找零，等于 cashReceivedCents − amountCents，由服务端算好记在付款记录上，客户端原样显示。与 cashReceivedCents 同时出现
    Refund:
      type: object
      required: [id, reason, amountCents, createdAt]
      properties:
        id: { type: string, format: uuid }
        reason: { type: string }
        amountCents: { type: integer, minimum: 0, description: 这次退的金额。全用积分抵扣、实付为 0 的会员结账单整单退款时为 0，其余至少 1 }
        paymentId:
          type: string
          format: uuid
          description: >-
            退的是哪一笔付款（会员结账那一笔记它的第一条付款）。只有分几笔收款的单才记；一笔收齐的单不记，
            没记的退款按付款先后依次抵扣各笔可退的钱
        returnedProducts:
          type: object
          description: 本次退款实际退回并可再售的件数，按商品 ID 记；退服务费或货未退回时不下发。
          additionalProperties: { type: integer, minimum: 1, maximum: 1000000000 }
        createdAt: { type: string, format: date-time }
    PaymentInput:
      type: object
      required: [expectedVersion, method, amountCents]
      properties:
        expectedVersion: { $ref: '#/components/schemas/OrderVersion' }
        method: { type: string, enum: [cash, wechat, alipay] }
        amountCents: { type: integer, minimum: 1, description: 这一笔收多少，不超过还差的数（Order.outstandingCents）；等于它就收齐结清，少于它订单为部分付款 }
        cashReceivedCents:
          type: integer
          minimum: 1
          description: >-
            选填，只有现金能带：顾客实际给的现金（整数分），不小于 amountCents，找零（实收 − 收款金额）不超过 100000（¥1,000）。
            服务端算出找零，和实收一起记在这笔付款上（Payment.cashReceivedCents、changeCents）。不带就只登记收款金额
    RefundInput:
      type: object
      required: [expectedVersion, amountCents, reason]
      properties:
        expectedVersion: { $ref: '#/components/schemas/OrderVersion' }
        paymentId:
          type: string
          format: uuid
          description: 退哪一笔付款（Order.payments 里的 id）。分几笔收的单必须带；一笔收齐的单可以不带。不能是会员结账那一笔（走会员退款）或免单
        amountCents: { type: integer, minimum: 1, description: 这次退多少，不超过那一笔的 refundableCents }
        reason: { type: string, minLength: 1, maxLength: 200 }
        returnedProducts:
          type: object
          description: >-
            实际退回并可再售的件数，按商品 ID 记，默认不回补。退款金额不决定回补多少：
            退的可能是服务费，拆封的材料也未必还能卖。同一单多次退款的累计件数不得超过本单已售件数。
          additionalProperties: { type: integer, minimum: 0, maximum: 1000000000 }
    OrderDiscountInput:
      type: object
      required: [expectedVersion, kind, reason]
      properties:
        expectedVersion: { $ref: '#/components/schemas/OrderVersion' }
        kind: { type: string, enum: [fixed, percentage] }
        amountCents: { type: integer, minimum: 1 }
        rateBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
        reason: { type: string, minLength: 1, maxLength: 200 }
    CompInput:
      type: object
      required: [expectedVersion, reason]
      additionalProperties: false
      properties:
        expectedVersion: { $ref: '#/components/schemas/OrderVersion' }
        reason: { type: string, minLength: 1, maxLength: 200, description: 免单原因，必填 }
    SessionCharge:
      type: object
      description: >-
        一次计时此刻怎么计价，由后端按已发布的价算好（2026-10-06 收费政策）；停止计时的按停止那一刻算、不再变（frozenAt）。
        两端原样显示 summary（如「超时 25 分钟（宽限 10 分钟），按续时 30 分钟 ¥15.00 加收 1 块」），不在本地计算。不进入 version、不落库。
      required: [kind, summary, usedSeconds, overtimeSeconds]
      properties:
        kind:
          type: string
          enum: [package, free, companion, unpriced]
          description: package 按套餐（含续时与超时加收）；free 自由计时按时长分块；companion 陪客收陪客费（没发布时 0 元）；unpriced 对不上已发布的价，0 元占位、结账时填价
        summary: { type: string, description: 写给员工看的一句话，两端原样显示 }
        usedSeconds: { type: integer, minimum: 0, description: 计价按的使用秒数（不计的暂停已扣掉）；陪客为 0 }
        overtimeSeconds: { type: integer, minimum: 0, description: 定时超出约定时长（含已续）的秒数，没超时为 0 }
        graceMinutes: { type: integer, minimum: 1, description: 套餐按续时方案自动加收时的宽限分钟；超出不超过它不收。没有宽限时省略 }
        blockMinutes: { type: integer, minimum: 1, description: 按块收时的块长：超时加收是续时分钟，自由计时是每块分钟（30） }
        blockCents: { type: integer, minimum: 1, description: 每块的价 }
        blocks: { type: integer, minimum: 1, description: 收的块数（超时加收或自由计时）；不按块收时省略 }
        totalCents: { type: integer, minimum: 1, description: 系统按计时算出的计时费合计；有 0 元占位行时省略（结账时填价） }
        frozenAt: { type: string, format: date-time, description: 已停止计时（按座会话、整桌会话都能停）：计价按这一刻算、不再变。没停止计时的，计价算到收款（或免单）那一刻 }
    OrderTiming:
      allOf:
        - { $ref: '#/components/schemas/SessionCharge' }
        - type: object
          required: [applied]
          properties:
            applied: { type: boolean, description: 草稿开头的计时明细就是系统按计时算的这几行（会跟着计时自动重算）；false 表示员工改过计时行（或是 0.0.18 及更早建的草稿），不会自动改，结账时请核对 }
    OrderVersion:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: 服务端根据订单完整内容生成的不透明版本；客户端原样回传，不自行计算。相同内容版本相同，无需改写历史记录。
    Order:
      type: object
      required: [id, version, status, receivableCents, paidCents, refundedCents, refundableCents, settlement, createdAt]
      properties:
        id: { type: string, format: uuid }
        version: { $ref: '#/components/schemas/OrderVersion' }
        venueSessionId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        customer:
          allOf: [{ $ref: '#/components/schemas/AccountLabel' }]
          description: 关联顾客的称呼，散客单为 null。不进入 version、不落库。幂等重放回的是第一次的响应，重放 0.0.7 之前记下的响应时没有这个字段，按 null 处理
        status:
          type: string
          enum: [draft, partially_paid, paid, refunded, voided]
          description: >-
            draft 待结账（可改明细、折扣、顾客，计时明细跟着计时走）；partially_paid 部分付款：分笔付款收了第一笔、还没收齐，
            计价与明细已冻结，只能接着收下一笔（createOrderPayment）或对剩余免单（createOrderComp），不能改单、不能退款；
            收齐（已收 + 免单 = 应收）为 paid。部分退款后仍为 paid，退完为 refunded；撤销开台时那一台的草稿置为 voided（作废，不能再收款）
        receivableCents: { type: integer }
        paidCents: { type: integer, description: 实收：各笔收到的钱之和（现金、微信、支付宝、储值），不含免单 }
        outstandingCents:
          type: integer
          minimum: 0
          description: >-
            还差多少没收（应收 − 已收 − 免单）：草稿就是应收，部分付款是收齐还差的数，其余为 0。收款、对剩余免单都按它核对，
            客户端原样显示。不进入 version、不落库；幂等重放 0.0.21 及更早记下的响应时没有这个字段
        refundedCents: { type: integer, minimum: 0, description: 各次退款记录金额之和。不进入 version。 }
        refundableCents: { type: integer, minimum: 0, description: 登记退款金额的上限（已付减已退）；草稿、已撤销或已退完为 0。不进入 version。 }
        settlement:
          type: string
          enum: [member, standard, comp]
          description: >-
            本单怎么收的款，由服务端按会员流水与结清记录判断，不进入 version、不落库。
            comp：一分钱没收、整单免单结清（payments 里有 method 为 comp 的一条），不能退款（普通退款接口回 409 comp_not_refundable）。
            member：经会员结账收款（会员流水里有指向本单的 checkout），会员结账那一笔（Payment.member）用 loyalty/actions 的 refund
            按原付款比例办理（可分多次，预览用 refund_quote）；分笔付款时别人付的几笔照常走普通退款（带 paymentId）。
            standard：其余订单（普通收款、尚未收款或已撤销），退款走 /sales-orders/{id}/refunds。
            分笔付款收了一部分、剩下免单的单不算 comp（compCents 是免掉的部分），收到的钱照常按笔退。
        memberCheckout:
          $ref: '#/components/schemas/OrderMemberCheckout'
        compCents: { type: integer, minimum: 1, description: 免单免掉的金额（整单免单，或分笔付款后对剩余免单的那部分），只有带免单结清记录的订单才有。不进入 version、不落库 }
        autoLines:
          type: integer
          minimum: 0
          description: >-
            计时会话的订单才有：开头几行明细是系统按计时生成、员工没改过的，草稿时跟着计时重算（续时、改时长、标记陪客，
            以及时间流逝带来的超时加收与自由计时的块数，停止计时后按停止那一刻）。0 表示员工改过计时行，不再自动改。
            0.0.18 及更早建的订单没有这个字段。进入 version
        timing:
          allOf: [{ $ref: '#/components/schemas/OrderTiming' }]
          description: 只有计时会话（进行中、暂停、陪客或已停止等结账）的草稿才有：系统此刻按计时算的计时费与说明，结账页原样显示。不进入 version、不落库
        createdAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderLine' }
        discounts:
          type: array
          items: { $ref: '#/components/schemas/OrderDiscount' }
        payments:
          type: array
          items: { $ref: '#/components/schemas/Payment' }
        refunds:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
    OrderMemberCheckout:
      type: object
      description: >-
        只有 settlement 为 member 的订单才下发：本单会员结账动过的会员资产与线下补付，按指向本单的 checkout、earned 流水合计；
        退款按这几项的比例拆，退款之后这里仍是原结账的数字，已退回多少见 refunded。分笔付款时只算会员结账那一笔（储值与随会员结账收的线下款），
        送的积分也只按这一笔收到的钱算。不进入 version、不落库。
      required: [principalCents, giftCents, pointsUsed, pointsEarned, offlineCents]
      properties:
        principalCents: { type: integer, minimum: 0, description: 从储值本金扣的金额，退款时按比例退回原账户 }
        giftCents: { type: integer, minimum: 0, description: 从赠送余额扣的金额，退款时按比例退回原账户 }
        pointsUsed: { type: integer, minimum: 0, description: 抵扣用掉的积分，退款时按比例回到原批次并保留原到期时间 }
        pointsEarned: { type: integer, minimum: 0, description: 本单送出的积分，退款时按比例从原批次收回；已被使用、不够收回则退款被拒绝（见 refundBlocked） }
        offlineCents: { type: integer, minimum: 0, description: 随会员结账收的现金、微信、支付宝线下补付；系统只登记，由员工按原付款方式退还。分笔付款时别人后来分笔付的不算在内（那几笔各退各的） }
        refundableCents:
          type: integer
          minimum: 0
          description: 会员结账那一笔还能退多少（会员退款 amountCents 的上限）；会员结账一次收齐的单就是订单的 refundableCents。幂等重放 0.0.21 及更早记下的响应时没有
        refunded:
          allOf: [{ $ref: '#/components/schemas/MemberRefundPart' }]
          description: 此前各次退款累计退回、收回的数。退过款才有；只在单张订单的响应里带，列表不带
        balanceAfter:
          type: object
          description: >-
            这位顾客在本单结账记完账那一刻的余额与可用积分（小票印「本单结账后余额」）。由不可改写的会员流水推出：
            本单的结账扣款与送分及之前的全部流水，积分按那一刻是否到期算；之后的充值、消费、退款（含本单退款）都不改变它。
            只在单张订单的响应里下发（GET /sales-orders/{id}、写订单与会员结账的响应），列表不带
          required: [principalCents, giftCents, points]
          properties:
            principalCents: { type: integer, minimum: 0, description: 结账后的储值本金 }
            giftCents: { type: integer, minimum: 0, description: 结账后的赠送余额 }
            points: { type: integer, minimum: 0, description: 结账后可用的积分 }
        refundBlocked:
          allOf: [{ $ref: '#/components/schemas/MemberRefundBlocked' }]
          description: 现在退不了剩余全部时才下发（说明以退剩余全部计）。只在单张订单的响应里、且订单还没退完时核对，列表不带
    OrderList:
      type: array
      items: { $ref: '#/components/schemas/Order' }
    PurchaseItem:
      type: object
      required: [productId, quantity, unitCostCents]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1 }
        unitCostCents: { type: integer, minimum: 0 }
    PurchaseInput:
      type: object
      required: [supplierName, items]
      properties:
        supplierName: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 200 }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PurchaseItem' }
    PurchaseReceipt:
      type: object
      description: 新建的采购单（不回显采购备注）。
      required: [id, supplierName, items, createdAt]
      properties:
        id: { type: string, format: uuid }
        supplierName: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/PurchaseItem' }
        createdAt: { type: string, format: date-time }
    StockAdjustmentResult:
      type: object
      required: [id, quantity]
      properties:
        id: { type: string, format: uuid, description: 库存项目编号（不是调整记录的编号） }
        quantity: { type: integer, minimum: 0, description: 调整后的库存数量 }
    InventoryAdjustmentInput:
      type: object
      required: [stockItemId, quantityDelta, reason]
      properties:
        stockItemId: { type: string, format: uuid }
        quantityDelta: { type: integer }
        reason: { type: string, minLength: 1, maxLength: 200 }
        expectedQuantity:
          type: integer
          minimum: 0
          description: 可选。提交时界面上的当前库存；给了就和这个库存项目的当前数量比，不一致返回 409 stock_quantity_conflict。只比这一个库存项目，不受其他商品变动影响。不传则不比（小程序）。
    CatalogInput:
      type: object
      required: [name, unitPriceCents]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 9007199254740991 }
        barcode:
          type: string
          description: >-
            商品条码，可不填。去掉首尾空白后须为 1–64 个可打印 ASCII（英文字母、数字、符号，不含空格），覆盖 EAN-13、UPC、Code128，
            区分大小写；空串表示没有条码（修改时即清除）。同一条码只能属于一件商品，已被占用回 409 barcode_taken
    CatalogPatch:
      type: object
      description: 只改带了的字段，至少一项
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 9007199254740991 }
        barcode: { type: string, description: 同 CatalogInput.barcode；空串清除条码 }
    CatalogItem:
      type: object
      required: [id, name, unitPriceCents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 9007199254740991 }
        barcode: { type: string, pattern: '^[!-~]{1,64}$', description: 商品条码；没登记时不带 }
    PurchasePrefill:
      type: object
      required: [lastUnitCosts]
      properties:
        supplierName: { type: string, description: 最近一次入库的供应商；还没入过库时不带 }
        lastUnitCosts:
          type: array
          description: 每件入过库的商品最近一次入库的进价；没入过库的商品不在里面
          items:
            type: object
            required: [productId, unitCostCents]
            properties:
              productId: { type: string, format: uuid }
              unitCostCents: { type: integer, minimum: 0, description: 进价（分） }
    StockItem:
      type: object
      required: [id, productId, quantity, alertAt, lowStock]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        quantity: { type: integer }
        alertAt: { type: integer, minimum: 0, description: 预警线（件），默认 0，店长、老板可改 }
        lowStock: { type: boolean }
    StockItemList:
      type: array
      items: { $ref: '#/components/schemas/StockItem' }
    StockItemAlertInput:
      type: object
      additionalProperties: false
      required: [alertAt]
      properties:
        alertAt: { type: integer, minimum: 0, maximum: 1000000, description: 预警线（件）；库存不高于它即库存偏低 }
    StockMovement:
      type: object
      required: [id, stockItemId, productId, kind, quantityDelta, createdAt]
      properties:
        id: { type: string, format: uuid }
        stockItemId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        kind:
          type: string
          enum: [purchase, adjustment, sale, refund, loyalty]
          description: purchase 采购入库；adjustment 盘点调整；sale 销售出库；refund 退款回补；loyalty 会员结账、积分兑换、生日礼物核销出库与会员退款回补
        quantityDelta: { type: integer, description: 正数入库，负数出库 }
        createdAt: { type: string, format: date-time }
        reason: { type: string, description: 仅盘点调整：员工填写的原因 }
        referenceId: { type: string, description: 采购为采购单号；销售、退款为订单号；会员业务为订单号或会员流水号 }
        supplierName: { type: string, description: 仅采购 }
        note: { type: string, description: 仅采购：采购备注 }
        actorId: { type: string, format: uuid, description: 办这笔的员工。2026-10 之前的流水没有记录，不带 }
        actorName: { type: string, description: 办这笔的员工当前昵称，读取时换算（店员看流水不用另查账户）；没有操作人时不带 }
    StockMovementList:
      type: array
      items: { $ref: '#/components/schemas/StockMovement' }
    AuditEvent:
      type: object
      description: 一条审计记录。字段总是下发，没有内容时为空串。
      required: [id, action, objectId, reason, accountId, actor, requestId, createdAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string }
        objectId: { type: string }
        reason: { type: string }
        accountId: { type: string, description: 操作人账户编号；系统操作为 system }
        actor:
          allOf: [{ $ref: '#/components/schemas/AccountLabel' }]
          description: 操作人的称呼；系统操作或账户不在了为 null
        requestId: { type: string }
        createdAt: { type: string, format: date-time }
    AuditLogList:
      type: array
      items: { $ref: '#/components/schemas/AuditEvent' }
    CodeSettings:
      type: object
      required: [envVersion, customerWebsite, updatedAt]
      properties:
        envVersion:
          type: string
          enum: [release, trial, develop]
          description: >-
            桌码和网页后台的登录码指向的小程序版本：release 正式版、trial 体验版（只有体验成员能打开）、
            develop 开发版（只有小程序开发者能打开）。老板没改过时是 trial：小程序还没有正式版。
        customerWebsite: { type: string, format: uri, description: '顾客域名的地址（如 https://pindou.example.invalid），网页桌码印的是 <它>/t?tableId=…：微信扫进小程序，别的扫码工具打开的是「请用微信扫码」的说明' }
        updatedAt: { type: [string, 'null'], format: date-time, description: 老板最后一次修改的时刻；没改过为 null }
    BillingSettings:
      type: object
      required: [enabled, updatedAt]
      properties:
        enabled: { type: boolean, description: 系统内收费开着没有；老板没改过时是 false }
        updatedAt: { type: [string, 'null'], format: date-time, description: 老板最后一次修改的时刻；没改过为 null }
    BillingSettingsInput:
      type: object
      additionalProperties: false
      required: [enabled, expectedEnabled, reason]
      properties:
        enabled: { type: boolean }
        expectedEnabled: { type: boolean, description: 老板确认时看到的状态 }
        reason: { type: string, minLength: 1, maxLength: 200, description: 为什么改，记进审计 }
    CodeSettingsInput:
      type: object
      additionalProperties: false
      required: [envVersion, expectedEnvVersion, reason]
      properties:
        envVersion: { type: string, enum: [release, trial, develop] }
        expectedEnvVersion: { type: string, enum: [release, trial, develop], description: 老板确认时看到的版本 }
        reason: { type: string, minLength: 1, maxLength: 200, description: 为什么改，记进审计 }
    ServiceCallInput:
      type: object
      required: [venueSessionId]
      properties:
        venueSessionId: { type: string, format: uuid, description: 为哪一次计时呼叫（本次手作页的会话编号） }
    ServiceCall:
      type: object
      description: >-
        一次呼叫店员。员工视图（列表、标记已处理、我去处理）多带 customer、handledBy、claimedBy；
        顾客自己看的不带这些：有员工认领着（claimStatus 为 claimed）时顾客页写「店员正在过来」，不显示是哪位员工。
      required: [id, venueSessionId, serviceTableId, tableCode, seatNumber, status, displayStatus, createdAt, handledAt, cooldownSeconds, claimStatus, claimedAt]
      properties:
        id: { type: string, format: uuid }
        venueSessionId: { type: string, format: uuid }
        serviceTableId: { type: string, format: uuid, description: 会话现在所在的桌 }
        tableCode: { type: string, description: 桌位在布局里的编码（A1、B3…），店员按它找桌 }
        seatNumber: { type: integer, minimum: 0, description: 会话现在的座号；整桌开台的旧会话为 0 }
        status: { type: string, enum: [pending, handled], description: 已存的状态，只有店员处理会改 }
        displayStatus:
          type: string
          enum: [pending, handled, expired]
          description: 此刻的状态：没人处理、叫了满 30 分钟的显示为 expired，已存 status 不变。前端一律看这个字段
        createdAt: { type: string, format: date-time }
        handledAt: { type: [string, 'null'], format: date-time, description: 店员处理的时间，没处理为 null }
        cooldownSeconds:
          type: integer
          minimum: 0
          maximum: 60
          description: 店员处理后 1 分钟内不能再叫：读取时还要等的秒数，0 表示不用等。前端在两次刷新之间按它倒数，不看手机时钟
        customer:
          $ref: '#/components/schemas/AccountLabel'
          description: 叫的顾客的称呼（员工视图才有）
        handledBy:
          $ref: '#/components/schemas/AccountLabel'
          description: 处理的员工的称呼（员工视图才有），没处理为 null
        claimStatus:
          type: string
          enum: [none, claimed, lapsed]
          description: >-
            此刻的认领状态（读的时候按时间算）：none 没人点过「我去处理」；claimed 有员工认领着（认领不到 10 分钟），
            员工端不再为它振动、响铃；lapsed 认领满 10 分钟还没处理，认领失效、重新提醒所有员工。
            只在 displayStatus 为 pending 时有意义；认领失效没有推送，靠定时重读
        claimedAt: { type: [string, 'null'], format: date-time, description: 最近一次「我去处理」的时间，没人认领过为 null }
        claimedBy:
          $ref: '#/components/schemas/AccountLabel'
          description: 最近一次认领的员工的称呼（员工视图才有），没人认领过为 null
    ServiceCallList:
      type: array
      items: { $ref: '#/components/schemas/ServiceCall' }
    MemberCode:
      type: object
      description: 会员码：小程序把 code 原样画成二维码。前端按 validSeconds 从收到起算有没有过期，不看手机时钟和 expiresAt 比
      required: [code, expiresAt, validSeconds]
      properties:
        code: { type: string, pattern: '^9[0-9]{19}$', description: 20 位数字，首位 9 }
        expiresAt: { type: string, format: date-time }
        validSeconds: { type: integer, minimum: 1, description: 从签发起有效的秒数（现为 90），小程序每分钟换一个新码 }
    MemberCodeAccount:
      type: object
      description: 凭会员码查到的顾客：账户摘要（同 /accounts 列表，不带头像）加会员资产摘要（同 /loyalty/members）
      required: [id, nickname, phoneMasked, phoneVerificationStatus, roles, balance]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        phoneMasked: { type: string, description: 打码后的手机号，没留手机号为空串 }
        phoneVerificationStatus: { type: string, enum: [verified, unverified] }
        roles:
          type: array
          description: 持久员工任命
          items: { type: string, enum: [clerk, manager, owner] }
        balance: { $ref: '#/components/schemas/LoyaltyBalance' }
    Error:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }

    LoyaltyRule:
      type: object
      properties:
        amountCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        giftCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        points:
          type: integer
          minimum: 0
          maximum: 1000000000
        minimumPoints:
          type: integer
          minimum: 0
          maximum: 1000000000
        renewalCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        rateBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        maxBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        durationMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        renewalMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        pauseLimitMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        id: &loyalty002
          type: string
        kind:
          type: string
          enum:
          - tier
          - recharge
          - earn
          - redeem
          - exchange
          - birthday
          - package
          - free_timing
          - companion
        name:
          type: string
          minLength: 1
          maxLength: 60
        enabled: &loyalty001
          type: boolean
        validDays:
          type: integer
          minimum: 0
          maximum: 3650
        mode:
          type: string
          enum:
          - ''
          - single
          - cumulative
          - day
          - month
        scope:
          type: string
          enum:
          - ''
          - all
          - goods
          - service
          - points
          - gift
          - discount
        stack: *loyalty001
        productId: *loyalty002
        quantity:
          type: integer
          minimum: 0
          maximum: 100000
        perUserLimit:
          type: integer
          minimum: 0
          maximum: 100000
        overtime:
          type: string
          enum:
          - ''
          - manual
          - free
          - renewal
        overtimeGraceMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: 套餐超时处理为 renewal 时的宽限分钟（界面默认 10）：超出不超过它不收。其余规则为 0，为 0 时不下发
        untilClose:
          type: boolean
          enum: [true]
          description: >-
            「到打烊」的套餐（全天不限时）：durationMinutes 为 0，开台时按到当天打烊（「营业与预约」的每天结束时间 closeMinute）算出时长，
            不足一分钟按一分钟；预约从所选开始时间约到打烊。不能续时（续时分钟与价格为 0）、不能暂停（pauseLimitMinutes 为 0）、超时不能选 renewal。
            已过打烊不能用它开台。不是这种套餐时不下发
        boardUses:
          type: integer
          minimum: 0
          maximum: 1000
          description: >-
            充值方案附送的智能豆板次数（2026-10-27 起）：充值登记时随本金、赠送余额一起到账，不过期。只有 recharge 能填，
            其余规则带了回 400；为 0（不送）时不下发，提交时不带或带 0 都是不送
      required: [id, kind, name, enabled, amountCents, giftCents, points, rateBasisPoints, maxBasisPoints, minimumPoints, validDays,
        mode, scope, stack, productId, quantity, perUserLimit, durationMinutes, renewalMinutes, renewalCents, pauseLimitMinutes, overtime]
      description: 服务端总是下发全部字段，用不到的为零值或空串；提交（preview_rule、save_rule）时也带全部字段。草稿 id 空串表示新建。tier 要求正门槛、single/cumulative 模式及正计价基点；recharge 金额为正；earn 金额与积分为正、scope 为 all/goods/service；redeem
        金额积分与抵扣上限为正；exchange 需商品、积分、数量和每人上限；birthday 需 day/month、points/gift/discount，领取次数 1–12、正有效期及对应权益；package 需 1–1440
        分钟（到打烊的为 0，见 untilClose），价格可以为 0（未定价：系统内收费关着时只管时长；开着时没定价的套餐不能用来开台、预约，也不出现在 /loyalty/public、会员视图和预约视图的套餐里，只在老板的经营规则里列出），续时分钟与价格同时为零或同时为正，超时为 manual（提示员工）/free（不加钱）/renewal（按续时方案自动加收：超出不超过 overtimeGraceMinutes
        分钟不收，超过就从套餐结束时起按续时方案分块加收、不足一块按一块；要有续时方案），宽限只给 renewal 用；free_timing 是自由计时价，amountCents 为每块的价、
        durationMinutes 固定 30（每 30 分钟一块，按实际使用时长不含暂停分块、不足一块按一块）；companion 是陪客费，amountCents 为陪客会话结账时带的固定价。
        free_timing、companion 与 earn、redeem 一样全店同时最多生效一项。已发布的规则含义不变：旧套餐保持原来的超时处理，改用新方式要重新发布。
    LoyaltyPublication:
      type: object
      properties:
        id: &loyalty003
          type: string
          format: uuid
        rule:
          $ref: '#/components/schemas/LoyaltyRule'
        actorId: *loyalty003
