    LoyaltyConsumption:
      type: object
      description: 消费登记（kind 为 consume）记下的内容；撤销消费（consume_reverse）带回原来那一份，便于明细写清撤销的是哪一笔
      required: [packageId, packageName, headcount, dayType, amountCents, extraCents]
      properties:
        packageId: { type: string, description: 选的套餐（已发布的 package 规则 ID）；选「其他」时为空串 }
        packageName: { type: string, description: 登记那一刻套餐的名字（快照），「其他」时为「其他」 }
        headcount: { type: integer, enum: [1, 2], description: 单人 1、双人 2 }
        dayType: { type: string, enum: [workday, holiday], description: 工作日或节假日（店员选，默认按星期：周六日算节假日） }
        amountCents: { type: integer, minimum: 0, maximum: 1000000000, description: 店员按价目填的这次消费金额 }
        extraCents:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: 余额不够扣时差的钱，在系统外另收（只是记录）。实际从储值扣的 = amountCents − extraCents，先扣本金、再扣赠送
    LoyaltyBalanceAfter:
      type: object
      description: 记完这一笔那一刻的余额与智能豆板次数（记账时存下，以后改算法也不变）。这版之前记的流水没有
      required: [principalCents, giftCents, boardUses]
      properties:
        principalCents: { type: integer, minimum: 0, maximum: 1000000000 }
        giftCents: { type: integer, minimum: 0, maximum: 1000000000 }
        boardUses: { type: integer, minimum: 0, maximum: 1000000000 }
    LoyaltyConsumptionInput:
      type: object
      additionalProperties: false
      required: [headcount, dayType, amountCents, boardUses]
      properties:
        packageId: { type: string, format: uuid, description: 已发布、启用的套餐规则 ID；不带是「其他」，这时 reason（备注）必填 }
        headcount: { type: integer, enum: [1, 2] }
        dayType: { type: string, enum: [workday, holiday] }
        amountCents: { type: integer, minimum: 0, maximum: 1000000000, description: 这次消费金额（分）；余额不够时扣光余额，差额记为 extraCents }
        boardUses: { type: integer, minimum: 0, maximum: 100, description: 这次用掉几次智能豆板，不能超过剩余次数（不够回 409）。amountCents 与 boardUses 不能都为 0 }
    MemberAccountInput:
      type: object
      additionalProperties: false
      required: [nickname, phone, consent]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 50 }
        phone: { type: string, minLength: 1, maxLength: 30, description: 去掉空格和横线后须为 6～15 位数字，可带开头的 +（同网页注册） }
        consent: { type: boolean, enum: [true], description: 员工确认顾客已同意门店记下称呼和手机号 }
    MemberAccountOpened:
