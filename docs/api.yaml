      - delta
    LoyaltyEntry:
      type: object
      properties:
        id: *loyalty003
        accountId: *loyalty003
        kind:
          type: string
          enum:
          - recharge
          - tier
          - adjust
          - recharge_refund
          - exchange
          - birthday
          - fulfill_gift
          - checkout
          - earned
          - refund
          - birthday_used
          - consume
          - consume_reverse
        sourceId: *loyalty002
        reason: *loyalty002
        serviceDate:
          type: string
          format: date
          description: >-
            消费登记、充值登记时选的门店日期（可以是以前的日子，补录用）；顾客明细按它显示日期。别的流水和这版之前的充值没有它，按 createdAt 的门店日期显示
        boardUses:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
          description: 这一笔让智能豆板次数变了多少（充值赠送、手动加为正，消费用掉、手动减为负）；没变时不下发
        consumption:
