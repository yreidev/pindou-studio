      type: object
      additionalProperties: false
      required: [wechatLoginCode, phone, password, privacyContractVersion]
      properties:
        wechatLoginCode: { type: string, minLength: 1, maxLength: 2048 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        password: { type: string, minLength: 1, maxLength: 128, description: 员工发的临时密码，或以前在顾客网页设的密码 }
