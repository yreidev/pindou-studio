      description: 先在当前应收上应用会员或已领生日折扣中更优惠的一种，再按完整积分块抵扣，再本金、赠送余额、线下补付；积分基数排除积分抵扣，按商品/服务原价比例分摊实付后向下取整。
    LoyaltyAction:
      type: object
      properties:
        action:
          type: string
          enum:
          - preview_rule
          - save_rule
          - publish
          - disable
          - birthday
          - claim
          - recharge
          - adjust
          - recharge_refund
