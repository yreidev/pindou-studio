          - cash
          - wechat
          - alipay
        points:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        principalCents:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        giftCents:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        useBalance: *loyalty001
        serviceTableId: *loyalty003
        seatNumber:
          type: integer
          minimum: 1
          maximum: 99
        returnedProducts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
            maximum: 1000000000
        amountCents:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: refund、refund_quote 这次退的金额（分），不超过订单的 refundableCents；不带为退剩余全部（整单退款）
        cashReceivedCents:
          type: integer
          minimum: 1
          description: >-
            只用于 checkout，选填：这次收的线下补付走现金时顾客实际给的现金，规则同 PaymentInput.cashReceivedCents
            （不小于这次收的线下款，找零不超过 ¥1,000）。method 不是 cash、这次不收线下款、或别的 action 带它都回 400 invalid_request
        offlineCents:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: >-
            只用于 checkout，选填（分笔付款、多人合付）：这次随会员结账收多少线下补付，0 到报价的 offlineCents。不带就是报价的线下补付全部、
            一次收齐（和以前一样）。少收时订单为 partially_paid，余下的用 createOrderPayment 分笔收或对剩余免单；会员价（会员优惠、积分抵扣）
            照旧按整单定，计时停在这一刻。会员这一笔要收到钱（用储值，或这次至少收一部分线下款），否则 400；储值与这次收的线下款标为
            Payment.member，退款时一起按原付款比例退。消费积分只按会员这一笔收到的钱送。别的 action 带它回 400
        balanceCents:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: >-
            只用于 quote、checkout，选填（会员只用储值付自己那份，多人合付）：这次最多用多少储值（本金 + 赠送，整数分），要和 useBalance 一起带；
            不带照旧能用多少用多少。不能超过可用储值，也不能超过会员优惠、积分抵扣之后这一笔应付的，否则 400 invalid_request（message 说明超了哪个）。
            扣的先后照旧先本金、后赠送，余下的进线下补付（offlineCents）。checkout 要带和报价时一样的值（报价版本按它算）。
            储值也算会员这一笔收到的钱：用了储值，这次可以一分线下款都不收。退款照旧按这一笔实际的构成（线下、本金、赠送）等比例退
        coupon:
          allOf: [{ $ref: '#/components/schemas/Coupon' }]
          description: >-
            团购记录，只用于 request（顾客扫码入座时选填；不填而顾客约过这个座位的，带上预约里填的）和 confirm（员工确认时改：
            不带是保留申请里的，带了平台和券码都为空串是清掉）。别的 action 带它回 400 invalid_request
        serviceDate:
          type: string
          format: date
          description: >-
            只用于 consume（必填）和 recharge（选填，不带是今天）：门店日期（中国标准时间），补录以前的消费、充值时选那天。
            不能是将来；早于今天 7 天以上（今天往前第 8 天及更早）的只有店长、老板能登记，店员带了回 403 forbidden。别的 action 带它回 400
        consumption:
          allOf: [{ $ref: '#/components/schemas/LoyaltyConsumptionInput' }]
          description: 只用于 consume（必填）。别的 action 带它回 400
        boardUses:
          type: integer
          minimum: -1000
          maximum: 1000
          description: 只用于 adjust：智能豆板次数加几次（负数为减），扣不成负数。别的 action 带它回 400
      required:
      - action
      additionalProperties: false
      allOf:
      - if:
          properties:
            action: { const: preview_rule }
        then:
          required: [rule]
      - if:
          properties:
            action:
              const: save_rule
        then:
          required:
          - rule
          - expectedVersion
      - if:
          properties:
            action:
              const: publish
        then:
          required:
          - targetId
          - expectedVersion
          - reason
      - if:
          properties:
            action:
              const: disable
        then:
          required:
          - targetId
          - expectedVersion
          - reason
      - if:
          properties:
            action:
              const: birthday
        then:
          required:
          - birthday
      - if:
          properties:
            action:
              const: claim
        then:
          required:
          - expectedVersion
          - targetId
      - if:
          properties:
            action:
              const: recharge
        then:
          required:
          - expectedVersion
          - targetId
          - accountId
          - method
      - if:
          properties:
            action:
              const: adjust
        then:
          required:
          - accountId
          - expectedVersion
          - reason
      - if:
          properties:
            action:
              const: consume
        then:
          required:
          - accountId
          - expectedVersion
          - serviceDate
          - consumption
      - if:
          properties:
            action:
              const: consume_reverse
        then:
          required:
          - accountId
          - targetId
          - expectedVersion
          - reason
      - if:
          properties:
            action:
              const: recharge_refund
        then:
          required:
          - targetId
          - accountId
          - reason
      - if:
          properties:
            action:
              const: exchange
        then:
          required:
          - expectedVersion
          - accountId
          - targetId
      - if:
          properties:
            action:
              const: fulfill_gift
        then:
          required:
          - accountId
          - targetId
      - if:
          properties:
            action:
              const: request
        then:
          required:
          - expectedVersion
          - targetId
          - serviceTableId
          - seatNumber
      - if:
          properties:
            action:
              const: cancel_request
        then:
          required:
          - targetId
      - if:
          properties:
            action:
              const: confirm
        then:
          required:
          - targetId
      - if:
          properties:
            action:
              const: reject
        then:
          required:
          - targetId
      - if:
          properties:
            action:
              const: pause
        then:
          required:
          - targetId
          - expectedVersion
      - if:
          properties:
            action:
              const: resume
        then:
          required:
          - targetId
          - expectedVersion
      - if:
          properties:
            action:
              const: stop
        then:
          required:
          - targetId
          - expectedVersion
      - if:
          properties:
            action:
              const: end
        then:
          required:
          - targetId
          - expectedVersion
      - if:
          properties:
            action:
              const: renew
        then:
          required:
          - targetId
          - expectedVersion
      - if:
          properties:
            action:
              const: move
        then:
          required:
          - targetId
          - expectedVersion
          - serviceTableId
          - seatNumber
      - if:
          properties:
            action:
              const: quote
        then:
          required:
          - targetId
          - expectedVersion
      - if:
          properties:
            action:
              const: checkout
        then:
          required:
          - targetId
          - expectedVersion
          - quoteVersion
      - if:
          properties:
            action:
              const: refund
        then:
          required:
          - targetId
          - expectedVersion
          - reason
      - if:
          properties:
            action:
              const: refund_quote
        then:
          required:
          - targetId
          - expectedVersion
      description: preview_rule 返回计算示例且不更改资产；disable 停用正在生效的那一版（记录存生效内容，不含草稿里未发布的修改；没有生效时 409）；save_rule 店长/老板；publish/disable/recharge_refund 仅老板；refund、refund_quote 店长/老板；birthday/claim/request/cancel_request
        本人；其余仅员工（adjust 手动加减储值和积分 2026-10-10 起所有员工都能办，必须写原因，扣不成负数，加的积分不过期）。
        end 结束一台按座会话并放座（系统内收费关着时，见 /system/billing-settings）：会话状态改为 ended，草稿订单一并作废，审计 venue_session.ended；
        收费开着时 409 billing_enabled，订单已收过一部分钱时 409 partially_paid。系统内收费开着时，没填价（amountCents 为 0）的套餐不能 request、confirm（409）。
        「到打烊」的套餐（LoyaltyRule.untilClose）在 request、confirm 时按那一刻算到打烊的时长，已过打烊 409。targetId 按动作分别为规则、申请、会话、订单或原流水 ID。expectedVersion：save_rule/publish/disable 用 staff 的 version（只覆盖规则草稿与发布记录）；recharge/exchange/claim/request/adjust 用目标顾客 member 视图的 version（只覆盖已发布规则与该顾客自己的流水、生日资料和申请，别的顾客的变动不会让它失效）；计时动作用 sessionVersion，结账、refund 与 refund_quote 用订单 version（版本过期回 409 order_version_conflict）；checkout 还要求最新
        quote.version。保存草稿不改已发布规则。申请30分钟内可确认，员工确认前不计时。积分消费仅整数兑换块。会员结账单退款：refund 的 targetId 为还没退完的已付会员结账单（Order.settlement 为 member），可分多次部分退；amountCents 为这次退的金额，不带为退剩余全部（整单退款）。
        金额按本单原始实付构成等比例拆到线下补付、储值本金、赠送余额，抵扣用掉的积分按同一比例退回原批次（保留原到期时间），本单送出的消费积分按同一比例收回：
        各来源按「原数 × 金额 ÷ 实付」向下取整，积分的零头留到把这单退满的那一次结清；钱的三项合计等于金额，取整少掉的几分补给累计退得比原付款比例欠得最多的来源；
        退满那一次各来源退「原数 − 此前已退」，所以分几次退满都与一次整单退款结果相同。每次退款追加冲正流水与一笔退款记录（金额为这次退的金额），收到的钱都退完时订单变为 refunded；
        分笔付款（多人合付）的单，checkout 只能是第一笔（订单还是草稿时），可用 offlineCents 只收一部分线下补付；refund 只退会员结账那一笔
        （Payment.member 的几条，实付、线下补付、上限都只算这一笔，见 memberCheckout.refundableCents），别人分笔付的走普通退款；
        线下部分由员工按原渠道退还，系统只登记。按比例该收回的积分已被用掉、不够收回时 409 loyalty_conflict，message 说明缺多少积分（与 refund_quote 的 blocked.reason 相同），不记负积分或欠额。
        refund_quote 只算不写（不存幂等记录、不推送），返回这次将退回、收回什么（LoyaltyRefundQuote），页面确认前展示，提交 refund 时带它的 orderVersion。
        returnedProducts 仅填写实际可入库数量，与金额分摊无关，同一单累计不超过售出件数，默认不入库。所有变更原子持久化并保留幂等结果。
        consume（会员消费登记，2026-10-27 起，所有员工）：系统内收费关着时店员替会员记一次消费。consumption 写选的套餐、单人双人、工作日节假日、金额和用掉的智能豆板次数，
        reason 是备注（选「其他」时必填）。金额先扣本金、再扣赠送余额；余额不够时扣光余额，差额记为 consumption.extraCents（在系统外另收），不报错。
        智能豆板次数不够回 409 loyalty_conflict。追加一条 kind 为 consume 的流水（带 serviceDate、consumption、boardUses、balanceAfter）。
        consume_reverse（撤销消费，店长、老板）：targetId 为一条 consume 流水，reason 必填；追加一条 kind 为 consume_reverse、sourceId 指向原流水的反向流水，
        退回扣的本金、赠送和次数（consumption 带回原来那份），原流水不改。每条只能撤销一次，再撤回 409。
        recharge 的规则带 boardUses 时一起到账；recharge_refund 同时收回那笔充值送的次数，次数已被用掉、不够收回时 409。
        expectedVersion：consume、consume_reverse 同 adjust，用目标顾客 member 视图的 version。所有新记的流水都带 balanceAfter（记完那一刻的余额与次数）。
    LoyaltyRulePreview:
      type: object
      required: [preview]
      properties:
        preview: { type: string }
    MemberRefundPart:
      type: object
      description: 会员结账单一次（或累计几次）退款从各来源退回、收回的数，由服务端按原付款比例算好；前端只展示。
      required: [offlineCents, principalCents, giftCents, pointsRestored, pointsClawedBack]
      properties:
        offlineCents: { type: integer, minimum: 0, description: 线下补付里要退的钱，系统只登记，由员工按原付款方式退还 }
        principalCents: { type: integer, minimum: 0, description: 退回储值本金 }
        giftCents: { type: integer, minimum: 0, description: 退回赠送余额（不会退成本金） }
        pointsRestored: { type: integer, minimum: 0, description: 恢复的抵扣积分，回到原批次并保留原到期时间 }
        pointsClawedBack: { type: integer, minimum: 0, description: 收回的本单所送消费积分 }
    MemberRefundBlocked:
      type: object
      description: >-
        退不了时才下发：按比例该收回的本单所送积分已被用掉，收不回（提交退款同样回 409 loyalty_conflict，message 与 reason 相同）。
        门店手动调整加的积分是新开批次，补不回本单的批次；先把 spentBy 里的会员结账单退款，抵扣的积分回到原批次后才能退，或者少退一些（不超过 maxRefundableCents）。
      required: [reason, pointsShort, spentBy, maxRefundableCents]
      properties:
        reason: { type: string, description: 给人看的原因，与提交这笔退款被拒时的 message 相同 }
        pointsShort: { type: integer, minimum: 0, description: 这次按比例该收回的本单所送积分里已被用掉、收不回的分数 }
        maxRefundableCents: { type: integer, minimum: 0, description: 现在收得回积分、能退的最大金额；0 表示现在一分也退不了 }
        spentBy:
          type: array
          description: 用掉本单所送积分、且还没退回的流水，按记账先后
          items:
            type: object
            required: [kind, sourceId, points, createdAt]
            properties:
              kind: { type: string, description: checkout（会员结账抵扣，sourceId 是那张订单）、exchange（积分兑换）、adjust（门店手动调整扣减） }
              sourceId: { type: string }
              points: { type: integer, minimum: 1 }
              createdAt: { type: string, format: date-time }
    LoyaltyRefundQuote:
      description: >-
        refund_quote 的结果：会员结账单退 amountCents 时各来源将退回、收回什么，以及退不了时的说明（blocked）。
        只算不写；提交 refund 时把 orderVersion 作为 expectedVersion 带回，订单变了回 409 order_version_conflict，重读后重新预览。
      allOf:
      - $ref: '#/components/schemas/MemberRefundPart'
      - type: object
        required: [orderVersion, amountCents, refundableCents, settlesOrder]
        properties:
          orderVersion: { $ref: '#/components/schemas/OrderVersion' }
          amountCents: { type: integer, minimum: 0, description: 这次退的金额；全用积分抵扣、实付为 0 的单整单退时为 0 }
          refundableCents: { type: integer, minimum: 0, description: 这次退款之前本单还可退的金额 }
          settlesOrder: { type: boolean, description: 这次把这单退满，各来源的零头在这次结清 }
          blocked: { $ref: '#/components/schemas/MemberRefundBlocked' }
    LoyaltyActionResult:
      anyOf:
      - $ref: '#/components/schemas/LoyaltyRulePreview'
      - $ref: '#/components/schemas/LoyaltyMember'
      - $ref: '#/components/schemas/LoyaltyRule'
      - $ref: '#/components/schemas/LoyaltyPublication'
      - $ref: '#/components/schemas/LoyaltyProfile'
      - $ref: '#/components/schemas/LoyaltyAdmission'
      - $ref: '#/components/schemas/LoyaltyQuote'
      - $ref: '#/components/schemas/LoyaltyRefundQuote'
      - $ref: '#/components/schemas/Order'
      - type: object
        properties:
          session:
            $ref: '#/components/schemas/ServiceTableSession'
          version:
            $ref: '#/components/schemas/OrderVersion'
        required:
        - session
        - version
      - type: object
        properties:
          order:
            $ref: '#/components/schemas/Order'
          quote:
            $ref: '#/components/schemas/LoyaltyQuote'
        required:
        - order
        - quote
    Reservation:
      type: object
      description: 一条座位预约。不涉及金额，套餐字段为下单前的快照，到店开台时按当时已发布的套餐计费。「到打烊」的套餐 durationMinutes 是从开始时间到当天打烊的分钟数。
      properties:
        id: *loyalty003
        accountId: *loyalty003
        guestName:
          type: string
          maxLength: 20
          description: 员工代客登记且顾客尚无账户时的称呼；不保存手机号。
        serviceTableId: *loyalty003
        seatNumber:
          type: integer
          minimum: 1
          maximum: 99
        packageId: *loyalty003
        packageName: *loyalty002
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        amountCents:
          type: integer
          minimum: 0
          maximum: 1000000000
        startAt: *loyalty004
        status:
          type: string
          enum:
          - pending
          - confirmed
          - seated
          - cancelled
          - no_show
        venueSessionId: *loyalty003
        note:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 200
        createdBy: *loyalty003
        createdAt: *loyalty004
        decidedAt: *loyalty004
        coupon:
          allOf: [{ $ref: '#/components/schemas/Coupon' }]
          description: 团购记录；没填时省略。到店开台和顾客本人扫码入座这个座位时带进入座申请
      required:
      - id
      - serviceTableId
      - seatNumber
      - packageId
      - packageName
      - durationMinutes
      - amountCents
      - startAt
      - status
      - createdBy
      - createdAt
    ReservationEntry:
      type: object
      properties:
        reservation:
          $ref: '#/components/schemas/Reservation'
        displayStatus:
          type: string
          description: 展示状态。pending/confirmed 超过开始时间加宽限期后显示为 expired，已存 status 不变，座位同时不再被占用。
          enum:
          - pending
          - confirmed
          - seated
          - cancelled
          - no_show
          - expired
        endAt: *loyalty004
        tableNumber:
          type: integer
        notices:
          type: array
          items: { $ref: '#/components/schemas/ReservationNoticeKind' }
          description: >-
            仅顾客本人的视图、且门店开了顾客通知时返回：这条预约顾客已经允许过的微信通知（不管发没发、发没发成）。
            「我的预约」据此决定给不给「开启微信提醒」：待确认的要 confirmed、reminder、cancelled，已确认的要 reminder、cancelled。
        customerName:
          type: string
          description: 仅员工视图返回，取账户昵称或代客登记的称呼。
        phoneMasked:
          type: string
          description: 仅员工视图返回，已脱敏。
      required:
      - reservation
      - displayStatus
      - endAt
    ReservationSettings:
      type: object
      description: >-
        门店可预约范围、歇业日、爽约限制与门店联系方式，由老板发布。未设置时使用默认值：每天 09:00–22:00、30 分钟粒度、最多提前 7 天、至少提前 30 分钟、迟到宽限 30 分钟，
        不设歇业日，不限制爽约（统计天数 30），不填联系方式。时间与日期按中国时区判定。联系方式没填时不返回；保存时省略或传空串都表示不填。
        整份一起保存：歇业日期、每周休息日、爽约两项每次都带上。
      properties:
        enabled: *loyalty001
        openMinute:
          type: integer
          minimum: 0
          maximum: 1440
        closeMinute:
          type: integer
          minimum: 0
          maximum: 1440
        slotMinutes:
          type: integer
          minimum: 5
          maximum: 240
        advanceDays:
          type: integer
          minimum: 1
          maximum: 90
        leadMinutes:
          type: integer
          minimum: 0
          maximum: 1440
        graceMinutes:
          type: integer
          minimum: 5
          maximum: 240
        contactPhone:
          type: string
          maxLength: 20
          pattern: '^[0-9 +()-]*$'
          description: 门店电话，只含数字、空格、+、-、括号，去掉首尾空格后最多 20 个字符。小程序在预约超限提示、包间说明、预约须知里给顾客看，点一下拨号。
        contactWechat:
          type: string
          maxLength: 40
          pattern: '^\S*$'
          description: 门店微信号，去掉首尾空格后最多 40 个字符，不含空白。小程序在预约超限提示、包间说明、预约须知里给顾客看，点一下复制。
        address:
          type: string
          maxLength: 120
          description: 门店地址，去掉首尾空格后最多 100 个字、不能换行。小程序首页门店一行显示（2026-10-20 起）。
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: 门店纬度（腾讯地图坐标拾取得到的 GCJ-02），和经度一起填；都不填表示首页不给「导航」。
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: 门店经度（GCJ-02）。
        closedDates:
          type: array
          maxItems: 90
          items: { type: string, format: date }
          description: >-
            歇业日期（门店时区，YYYY-MM-DD），这些天顾客不能自助预约，员工代客登记不受限。保存时去重排序；新加的不能早于今天、最远一年以后，
            原来存着、日子已经过去的保存时自动去掉，读取时也不再返回。
        closedWeekdays:
          type: array
          maxItems: 6
          items: { type: integer, minimum: 1, maximum: 7 }
          description: 每周固定休息日，1 周一 … 7 周日，按门店时区；保存时去重排序。整周都不接待请关闭自助预约。
        noShowLimit:
          type: integer
          minimum: 0
          maximum: 20
          description: 最近 noShowWindowDays 天里被标记爽约（no_show）达到这个次数的账号暂停自助预约；0 表示不限制（默认）。员工代客登记不受限。
        noShowWindowDays:
          type: integer
          minimum: 1
          maximum: 365
          description: 统计爽约的天数：门店时区里含今天在内的最近这么多天，按预约开始时间算。默认 30。
        remindHours:
          type: integer
          minimum: 0
          maximum: 24
          description: >-
            开始前几小时给允许了微信提醒的顾客发「预约提醒通知」，0 不提醒（2026-10-20 起）。没设置过时不返回，按 2 小时算；保存时省略表示不改成别的（仍按 2 小时）。
            离开始已经不到这么久才确认的预约不再提醒。
      required:
      - enabled
      - openMinute
      - closeMinute
      - slotMinutes
      - advanceDays
      - leadMinutes
      - graceMinutes
      - closedDates
      - closedWeekdays
      - noShowLimit
      - noShowWindowDays
      additionalProperties: false
    MessageFeed:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        unreadCount:
          type: integer
          minimum: 0
          description: 90 天内未读的条数（不受 limit 影响）
    Message:
      type: object
      description: 「消息」页的一条。kind 为 loyalty 时带 entry，预约两种带 reservation（顾客本人视图，同 /reservations/me）。
      required: [id, kind, at, unread]
      properties:
        id:
          type: string
          description: 稳定编号，会员流水是 entry:<流水 ID>，预约是 reservation:<预约 ID>:confirmed 或 reservation:<预约 ID>:cancelled
        kind:
          type: string
          enum: [loyalty, reservation_confirmed, reservation_cancelled]
          description: loyalty 一条会员流水；reservation_confirmed 门店确认了预约或店员替本人登记了预约；reservation_cancelled 门店取消了预约（原因在 reservation.reason）
        at:
          type: string
          format: date-time
          description: 这件事发生的时刻：流水的 createdAt；预约是门店确认、代客登记或取消的那一刻（按审计记录），之后预约开台、爽约都不影响这条
        unread: { type: boolean }
        entry: { $ref: '#/components/schemas/LoyaltyEntry' }
        reservation: { $ref: '#/components/schemas/ReservationEntry' }
    ReservationNoticeKind:
      type: string
      enum: [confirmed, reminder, cancelled]
      description: 顾客预约的微信通知：confirmed 店员确认了（预约成功通知）、reminder 开始前提醒（预约提醒通知）、cancelled 店员取消了（预约取消通知）。
    ReservationView:
      type: object
      properties:
        reservations:
          type: array
          items:
            $ref: '#/components/schemas/ReservationEntry'
        busy:
          type: array
          description: >-
            仍会占座的时间段，不含身份，供顾客选择空档：还会到店的预约（kind=reservation），以及座位上正在进行、还没到结束时间的定时会话
            （kind=session，开始时间到桌位视图的 endsAt，含暂停；自由计时、已停止计时等结账的不列）。整桌会话、整桌售卖的桌按每个座号各列一条。
            顾客平面选座两种都算占用；员工代客登记只把预约当作占用，现场会话只提示。
          items:
            type: object
            properties:
              serviceTableId: *loyalty003
              seatNumber:
                type: integer
              startAt: *loyalty004
              endAt: *loyalty004
              kind:
                type: string
                enum: [reservation, session]
            required:
            - serviceTableId
            - seatNumber
            - startAt
            - endAt
            - kind
        packages:
          type: array
          items:
            $ref: '#/components/schemas/LoyaltyRule'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/LoyaltyTable'
        settings:
          $ref: '#/components/schemas/ReservationSettings'
        settingsVersion: *loyalty002
        closedDays:
          type: array
          items: { type: string, format: date }
          description: >-
            从今天起到最多提前天数为止（含两头，门店时区）的歇业日，含每周休息日展开后的日子，按日期排序。顾客的日期条把这些天标成「店休」、不能下单（不是「已约满」）；
            员工代客登记选到这些天时提示歇业，但照常可以登记。
        selfServiceSuspended:
          type: boolean
          description: 仅顾客本人的视图（/reservations/me 与顾客操作的响应）返回：本人最近爽约次数达到上限，暂停自助预约。
        customerCancellations:
          type: array
          description: >-
            仅员工 scope=open 的视图与员工操作的响应返回（2026-10-27 起）：开始时间在门店今天、还没到结束时间、被顾客自己取消的预约，
            按开始时间；员工点过「知道了」（action=acknowledge）的不列。员工替顾客取消的不算，以后几天的不列（预约页里照样看得到）。
            条目同员工视图的预约（带称呼、脱敏手机号），取消原因在 reservation.reason，顾客没选时为空。
          items:
            $ref: '#/components/schemas/ReservationEntry'
        noticeTemplates:
          type: array
          description: >-
            仅顾客本人的视图返回：小程序请求微信订阅消息用的模板，按 confirmed、reminder、cancelled 的顺序；门店没开顾客通知时为空数组，
            小程序就不弹订阅框、不给「开启微信提醒」。
          items:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/ReservationNoticeKind' }
              templateId: { type: string, minLength: 1 }
            required: [kind, templateId]
        version: *loyalty002
        targetId: *loyalty003
      required:
      - reservations
      - busy
      - packages
      - tables
      - settings
      - settingsVersion
      - closedDays
      - version
    ReservationAction:
      type: object
      properties:
        action:
          type: string
          enum:
          - book
          - register
          - confirm
          - cancel
          - no_show
          - seat
          - acknowledge
          - save_settings
        targetId: *loyalty003
        accountId: *loyalty003
        guestName:
          type: string
          maxLength: 20
        serviceTableId: *loyalty003
        seatNumber:
          type: integer
          minimum: 1
          maximum: 99
        packageId: *loyalty003
        startAt: *loyalty004
        note:
          type: string
          maxLength: 200
        reason:
          type: string
          maxLength: 200
          description: >-
            取消、爽约的原因，记进预约（reservation.reason），选填。顾客自己取消时小程序要顾客先选一个原因（2026-10-27 起），
            后端不强制：还在用旧版小程序的顾客取消时不带。
        expectedVersion: *loyalty002
        settings:
          $ref: '#/components/schemas/ReservationSettings'
        coupon:
          allOf: [{ $ref: '#/components/schemas/Coupon' }]
          description: 团购记录，只用于 book、register，选填
      required:
      - action
      additionalProperties: false
      allOf:
      - if:
          properties:
            action:
              const: book
        then:
          required:
          - serviceTableId
          - seatNumber
          - packageId
          - startAt
      - if:
          properties:
            action:
              const: register
        then:
          required:
          - serviceTableId
          - seatNumber
          - packageId
          - startAt
      - if:
          properties:
            action:
              const: save_settings
        then:
          required:
          - settings
          - expectedVersion
      - if:
          properties:
            action:
              enum:
              - confirm
              - cancel
              - no_show
              - seat
              - acknowledge
        then:
          required:
          - targetId
