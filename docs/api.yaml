        principalCents:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        giftCents:
          type: integer
          minimum: -1000000000
          maximum: 1000000000
        points:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LoyaltyPointChange'
        rule:
          $ref: '#/components/schemas/LoyaltyRule'
        createdAt: *loyalty004
