version: "2"

# The default set (errcheck, govet, ineffassign, staticcheck, unused) plus the
# checks that pay off for a money-handling HTTP/SQL service. Style-only linters
# are deliberately left out: they bury the findings that matter.
# 格式由 gofmt 定：以前没开，文档注释里缩进的续行、错位的缩进混进了仓库（gofmt 会把缩进的注释续行改成代码块）。
formatters:
  enable:
    - gofmt

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert

  settings:
    errcheck:
      # Deferred cleanup whose error the caller cannot act on. The real error is
      # the one already being returned; pgx rolls back automatically when a
      # transaction is not committed.
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (*github.com/jackc/pgx/v5.Conn).Close
        - (io.Closer).Close
        - (net.Conn).Close
    staticcheck:
      checks:
        - all
        # QF* are opt-in refactoring suggestions (tagged switches, De Morgan's
        # law), not correctness findings.
        - -QF1001
        - -QF1003
        # ST1000/ST1020/ST1021 enforce godoc comment phrasing. The comments in
        # this tree explain why code is shaped the way it is, which is more
        # useful here than restating the identifier's name.
        - -ST1000
        - -ST1020
        - -ST1021

  exclusions:
    rules:
      # RFC 6455 defines the WebSocket handshake in terms of SHA-1. It is a
      # protocol constant, not a security choice, and there is no alternative
      # digest a browser or the WeChat client would accept.
      - path: internal/app/realtime\.go
        linters: [gosec]
        text: "G(505|401)"
      # header is allocated with make([]byte, 2) immediately above; gosec loses
      # track of the constant length across the switch.
      - path: internal/app/realtime\.go
        linters: [gosec]
        text: "G602"
      # Test fixtures use literal tokens and build requests without a context.
      - path: _test\.go$
        linters: [gosec, noctx, errcheck]
